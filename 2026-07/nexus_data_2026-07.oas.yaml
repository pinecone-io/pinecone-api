      - tasks_completed
      - tasks_cancelled
      - tasks_by_state
      - tasks_by_workflow
      - captured_at
    ProjectWithWorkspaces:
      description: The active project plus whether this deployment requires a workspace host.
      allOf:
      - $ref: '#/components/schemas/Project'
      - description: The workspace-gating flag added on top of the project row.
        type: object
        properties:
          workspaces_required:
            description: True on a workspace-enabled cluster, where requests must use the `wksp.*` workspace host rather than the account host.
            type: boolean
        required:
        - workspaces_required
    Query:
      title: Query turn
      description: One query turn. Read the answer from `output[].content[].text`.
      type: object
      properties:
        id:
          description: Turn id, `qry_<uuid>`.
          type: string
        object:
          description: Always `query`, so a caller can tell this document apart from a session.
          x-enum:
          - query
          type: string
        session_id:
          description: The session this turn belongs to. A turn that started a new one names it here.
          type: string
        model:
          nullable: true
          description: The model that actually answered. Null before the turn resolves one.
          type: string
        created:
          description: Unix seconds
          type: integer
          format: int64
        status:
          description: Where the turn is in its lifecycle.
          x-enum:
          - in_progress
          - completed
          - failed
          - cancelled
          type: string
        error:
          nullable: true
          description: Failure detail. Set on a `failed` turn.
          type: string
        previous_query_id:
          nullable: true
          description: The turn this one continues. Null on a session's first turn.
          type: string
        comparison:
          nullable: true
          description: The sibling turns of the same Compare run. Null on a normal single query.
          type: array
          items:
            $ref: '#/components/schemas/QueryComparisonMember'
        feedback:
          nullable: true
          description: Thumbs-up/down recorded on this turn. Null until a caller submits some.
          type: object
          properties:
            rating:
              description: Thumbs up or down.
              x-enum:
              - up
              - down
              type: string
            comment:
              nullable: true
              description: Free-text note. Null when none was given.
              type: string
        input:
          description: The stored message array (plain-text `content`).
          type: array
          items:
            description: One message in the turn.
            type: object
            properties:
              role:
                description: Who sent the message, e.g. `user`.
                type: string
              content:
                description: The message text.
                type: string
            required:
            - role
            - content
        output:
          description: 'Output items; assistant text is `{role, content:[{type: output_text, text}]}`'
          type: array
          items:
            description: One output item.
            type: object
            properties:
              role:
                description: Who produced it, e.g. `assistant`.
                type: string
              content:
                description: The item's content parts.
                type: array
                items:
                  description: One content part.
                  type: object
                  properties:
                    type:
                      description: Part kind. `output_text` carries the answer.
                      type: string
                    text:
                      description: The text of this part.
                      type: string
                  required:
                  - type
                  - text
            required:
            - role
            - content
        output_json:
          nullable: true
          description: Present when a shape was used, or on a retrieval-only turn
          type: object
          additionalProperties: true
        citations:
          description: What the answer was grounded in. Empty on a turn that cited nothing.
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        max_steps:
          nullable: true
          description: The agentic tool-loop step cap this turn actually ran with, whether the request set it or the deployment default supplied it.
          type: integer
          format: int64
        thinking_level:
          nullable: true
          description: The thinking level this turn actually ran at. Null on the Claude-backed `search_cc`, which has no equivalent knob.
          type: string
        steps:
          description: The turn's reasoning steps, reduced from its `response.step` events.
          type: array
          items:
            $ref: '#/components/schemas/QueryStep'
        rollup:
          nullable: true
          description: End-of-turn counters. Null on a turn the runtime never closed.
          type: object
          allOf:
          - title: Response turn rollup
            description: A turn's end-of-turn counters. Served both as the stored `response.turn_rollup` event, which adds `type` and `query_id`, and as the trace blob's copy, which does not.
            x-component-name: TurnRollup
            type: object
            properties:
              type:
                description: Event form only.
                x-enum:
                - response.turn_rollup
                type: string
              query_id:
                description: Event form only.
                type: string
              n_steps:
                description: Reasoning steps the turn ran.
                type: integer
                format: int64
              n_tool_calls:
                description: How many calls the whole turn made.
                type: integer
                format: int64
              by_category:
                description: Tool calls tallied by category.
                type: object
                additionalProperties:
                  description: Calls made in that category.
                  type: integer
                  format: int64
              total_hits:
                description: Retrieved items across all calls, before dedup.
                type: integer
                format: int64
              duration_ms:
                description: Wall time for the whole turn.
                type: integer
                format: int64
              cache_read_tokens:
                description: Input tokens served from the prompt cache.
                type: integer
                format: int64
              cache_write_tokens:
                description: Input tokens written into the prompt cache.
                type: integer
                format: int64
        synthesis:
          nullable: true
          description: The answer completion's cost. Null on a turn that skipped synthesis, as retrieval-only turns do.
          type: object
          allOf:
          - title: Response synthesis
            description: Token counts and latency for the answer completion — the final compose step, not the retrieval loop the steps describe. Served both as the stored `response.synthesis` event and as part of a turn.
            x-component-name: QuerySynthesis
            type: object
            properties:
              type:
                description: Event form only.
                x-enum:
                - response.synthesis
                type: string
              query_id:
                description: Event form only.
                type: string
              status:
                description: How synthesis ended, e.g. `completed`.
                type: string
              tokens_in:
                description: The completion's input tokens.
                type: integer
                format: int64
              tokens_out:
                description: The completion's output tokens.
                type: integer
                format: int64
              ms:
                description: Wall time of the completion.
                type: integer
                format: int64
              answer_preview:
                description: Leading characters of the answer, for a progress display that has no full text yet.
                type: string
              tokens_in_cached:
                description: Input tokens served from the prompt cache.
                type: integer
                format: int64
              tokens_in_cache_write:
                description: Input tokens written into the prompt cache.
                type: integer
                format: int64
              tokens_in_fresh:
                description: Input tokens neither cached nor cache-written.
                type: integer
                format: int64
        trace_ref:
          nullable: true
          description: Blob key of the persisted trace. Fetch the trace itself from `GET /queries/{id}/trace`.
          type: string
        usage:
          description: The turn's token totals. Embed and rerank bill on their own seam and are not counted here.
          type: object
          properties:
            input_tokens:
              description: Input tokens the turn billed.
              type: integer
              format: int64
            output_tokens:
              description: Output tokens the turn billed.
              type: integer
              format: int64
            total_tokens:
              description: Input plus output tokens.
              type: integer
              format: int64
          required:
          - input_tokens
          - output_tokens
          - total_tokens
        runtime_ms:
          description: Wall time from turn start to terminal state.
          type: integer
          format: int64
      required:
      - id
      - object
      - session_id
      - created
      - status
      - input
      - output
      - citations
      - steps
      - usage
      - runtime_ms
    QueryComparisonMember:
      description: One sibling turn of a Compare run — the same ask answered under a different workflow or model.
      type: object
      properties:
        workflow:
          description: The workflow that turn ran.
          type: string
        query_id:
          description: That turn's id. Fetch it with `GET /queries/{id}`.
          type: string
        model:
          description: The model that answered it.
          type: string
    QueryCreatedEvent:
      title: Response created
      description: The turn was accepted. First frame of every stream.
      type: object
      properties:
        type:
          description: Identifies the event.
          x-enum:
          - response.created
          type: string
        query_id:
          description: The turn that was created.
          type: string
        session_id:
          description: The session the turn runs in — the one it continued, or the one it just started.
          type: string
    QueryDefaults:
      description: What `max_steps` and `thinking_level` resolve to when `POST /query` omits them. Read these to populate a picker rather than hard-coding the caps.
      type: object
      properties:
        max_steps:
          description: Workflow selector → its agentic tool-loop step cap. Keyed by the same selectors `POST /query` accepts, since each runs a different loop.
          type: object
          additionalProperties:
            description: The step cap that selector runs with.
            type: integer
            format: int64
        thinking_levels:
          description: Every accepted `thinking_level`, ascending. A value outside this list is rejected with `400`.
          type: array
          items:
            description: One reasoning depth the deployment allows.
            type: string
        thinking_level:
          description: The level a turn runs at when the request omits one.
          type: string
      required:
      - max_steps
      - thinking_levels
      - thinking_level
    QueryEvent:
      title: Progress event
      description: One progress event on a turn, discriminated by `type`. Emitted as SSE frames by a streaming `POST /query` and by `GET /queries/{id}/events`. An event whose `type` this version does not know is dropped rather than ending the turn.
      oneOf:
      - $ref: '#/components/schemas/QueryCreatedEvent'
      - $ref: '#/components/schemas/QueryStepEvent'
      - $ref: '#/components/schemas/QueryOutputTextDeltaEvent'
      - $ref: '#/components/schemas/TurnRollup'
      - $ref: '#/components/schemas/QuerySynthesis'
      - $ref: '#/components/schemas/QueryTraceEvent'
      - $ref: '#/components/schemas/QueryTerminalEvent'
    QueryOutputTextDeltaEvent:
      title: Response output text delta
      description: Answer text. Delivered as one delta once the runtime reports the turn, not token by token.
      type: object
      properties:
        type:
          description: Identifies the event.
          x-enum:
          - response.output_text.delta
          type: string
        query_id:
          description: The turn the text belongs to.
          type: string
        delta:
          description: The answer text.
          type: string
    QueryRequest:
      description: One KnowQL query turn. `scope` and the session-config fields are honored only when starting a NEW session and are pinned for its life; continue an existing one with `session_id` or `previous_query_id`. Every other field rides the turn and is not pinned.
      type: object
      properties:
        ask:
          description: The natural-language question
          type: string
        scope:
          description: Context slugs/UUIDs. New session only; pinned for the session's life. A scope may not mix work and search contexts.
          type: array
          items:
            description: A context slug or UUID.
            type: string
          minItems: 1
          maxItems: 10
        session_id:
          description: Continue an existing session
          type: string
        previous_query_id:
          description: Continue the session this query belongs to
          type: string
        workflow:
          description: Search workflow for this turn. Ignored for work contexts, which always run the `work` runtime.
          x-enum:
          - search
          - search_cc
          - search_rag
          type: string
        system_prompt:
          description: Instructions pinned to a new session
          type: string
        guardrails:
          description: Guardrails pinned to a new session
          type: string
        shape:
          description: JSON Schema subset for structured output; result in output_json
          type: object
          additionalProperties: true
        model:
          description: A catalog model id from `GET /models`, or a tier name (`lite`, `standard`, `pro`) to let the deployment resolve one. New session only; pinned for the session's life.
          type: string
        models:
          description: Ordered fallback list, tried in turn. Takes precedence over `model`.
          type: array
          items:
            description: A catalog model id or tier name.
            type: string
        tools:
          description: Tool names the turn may call. New session only; pinned for the session's life.
          type: array
          items:
            description: A tool name.
            type: string
        stream:
          description: SSE streaming. Mutually exclusive with background.
          type: boolean
        background:
          description: 'Fire-and-forget: 202 + in_progress query; poll GET /queries/{id}. Mutually exclusive with stream.'
          type: boolean
        timeout_seconds:
          description: May only LOWER the 15-minute (900s) cap
          type: integer
          format: int64
        max_steps:
          description: Cap the agent's tool-loop steps for this turn
          type: integer
          format: int64
        thinking_level:
          description: Gemini reasoning depth. Default `low`. Gemini-backed workflows only; ignored for `search_cc`.
          x-enum:
          - minimal
          - low
          - medium
          - high
          type: string
        compose:
          description: Set `false` to skip synthesis, the same as `retrieval_only`.
          type: boolean
        retrieval_only:
          description: Skip synthesis; return retrieved hits in `output_json`
          type: boolean
        pointers_only:
          description: Skip synthesis; return just pointers in `output_json`
          type: boolean
        chunks_only:
          description: Retrieval-only, narrowed to chunks
          type: boolean
        artifacts_only:
          description: Retrieval-only, narrowed to artifacts
          type: boolean
        max_retrieved:
          description: Cap the item count for retrieval-only turns
          type: integer
          format: int64
        max_retrieved_chars:
          description: Cap per-item verbatim text length for retrieval-only turns
          type: integer
          format: int64
        comparison_group:
          description: Client-generated id shared by the turns of one Compare run, so a query cap counts them as one action rather than several. Where the cap applies, a group is limited to 3 turns and a fourth is refused with `409`. Omit for a normal query.
          type: string
      required:
      - ask
