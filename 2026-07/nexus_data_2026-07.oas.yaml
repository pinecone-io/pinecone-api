      - embed_by_model
    CurationState:
      description: What the last curate recorded, and what the next one resumes from.
      type: object
      properties:
        manifest:
          description: Per-source curate ledger, keyed by source path.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SourceManifestEntry'
        edges:
          description: Artifact ids each source contributed an edge to, keyed by source path.
          type: object
          additionalProperties:
            description: Artifact ids this source contributed an edge to.
            type: array
            items:
              description: One artifact id.
              type: string
        corpus_groups:
          description: The source groupings the corpus pass reduced over.
          type: array
          items:
            $ref: '#/components/schemas/CorpusGroup'
        live_version:
          description: The index version queries read.
          type: integer
          format: int64
        versions_stamped:
          description: Whether every index entry carries a version stamp, which is what lets a curate flip versions atomically.
          type: boolean
        source_removed:
          description: Delete tombstones awaiting the next curate, keyed by source path.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SourceRemoved'
        redispatch_count:
          description: How many times a curate on this context was killed and redispatched. The checkpointed run resumes rather than restarting.
          type: integer
        artifact_reclaim:
          description: Artifact swaps awaiting the next curate.
          type: array
          items:
            $ref: '#/components/schemas/ArtifactReclaim'
        source_pointers:
          description: The resume cursor a redispatched curate writes, keyed by source path. `{}` for a context whose curates all ran to completion.
          type: object
          additionalProperties:
            description: Mentions recorded for this source.
            type: array
            items:
              $ref: '#/components/schemas/PointerEntry'
        source_glossary:
          description: The glossary resume cursor, keyed by source path. `{}` for a context whose curates all ran to completion.
          type: object
          additionalProperties:
            description: Terms read verbatim out of the named file.
            type: array
            items:
              $ref: '#/components/schemas/GlossaryEntry'
      required:
      - manifest
      - edges
      - corpus_groups
      - live_version
      - versions_stamped
      - source_removed
      - redispatch_count
      - artifact_reclaim
      - source_pointers
      - source_glossary
    DeleteCuratedSourcesRequest:
