          - $ref: '#/components/schemas/Manifest'
        pinecone_api_key:
          description: Task-token override; normally not needed
          type: string
    ProfileEmptyOutput:
      title: Profile empty
      description: The profile had nothing to sample — a context with no sources, or none the manifest covers.
      type: object
      properties:
        state:
          description: How the run ended.
          type: string
        reason:
          description: Why no estimate could be made.
          type: string
      required:
      - state
      - reason
    ProfileEstimateOutput:
      title: Profile estimate
      description: An estimate of what curating the candidate manifest would cost, extrapolated from a sample of the corpus. Persists nothing.
      type: object
      properties:
        state:
          description: How the run ended.
          type: string
        g:
          description: Estimated distinct-artifact count with its uncertainty band. This is what drives the cost estimate, since extraction cost scales with it.
          type: object
          properties:
            value:
              description: Point estimate of the distinct-artifact count.
              type: integer
              format: int64
            lo:
              description: Low end of the band.
              type: integer
              format: int64
            hi:
              description: High end of the band.
              type: integer
              format: int64
            method:
              description: The estimator the recurrence blend selected; `empty` on the no-sample path
              type: string
            recurrence:
              description: How often the same subject recurs across sampled documents. Drives which estimator is chosen.
              type: number
              format: double
            confidence:
              description: Qualitative confidence in the estimate.
              type: string
            note:
              description: Caveat on how to read the estimate.
              type: string
          required:
          - value
          - lo
          - hi
          - method
          - recurrence
          - confidence
          - note
        density:
          description: Measured on the sampling window, not the full curate read-depth.
          type: object
          properties:
            entities_per_doc:
              description: Mean distinct subjects found per sampled document.
              type: number
              format: double
            avg_doc_chars:
              description: Mean source length in characters.
              type: integer
              format: int64
          required:
          - entities_per_doc
          - avg_doc_chars
        cost:
          description: Estimated token and time cost of the curate, one estimate per model tier.
          type: object
          properties:
            by_tier:
              description: One estimate per model tier.
              type: object
              properties:
                lite:
                  $ref: '#/components/schemas/ProfileTierCost'
                standard:
                  $ref: '#/components/schemas/ProfileTierCost'
                pro:
                  $ref: '#/components/schemas/ProfileTierCost'
              required:
              - lite
              - standard
              - pro
            default_tier:
              description: The tier the context's current `artifact_model` resolves to
              type: string
          required:
          - by_tier
          - default_tier
        sampling:
          description: How much of the corpus the profile actually read. The estimate is extrapolated from this much, so a small `fraction` means a wide band.
          type: object
          properties:
            n_total:
              description: Sources in the corpus.
              type: integer
              format: int64
            n_sampled:
              description: Sources the profile read.
              type: integer
              format: int64
            fraction:
              description: The `n_sampled` count over `n_total`.
              type: number
              format: double
            wall_s:
              description: Seconds the sampling itself took.
              type: number
              format: double
          required:
          - n_total
          - n_sampled
          - fraction
          - wall_s
      required:
      - state
      - g
      - density
      - cost
      - sampling
    ProfileInput:
      title: Profile
      description: What a profile run was started with.
      type: object
      properties:
        manifest:
          description: The candidate manifest the run profiles, not a stored one.
