components:
  schemas:
    ArchivedFileListing:
      title: Archived
      description: Read after the task's files were archived.
      type: object
      properties:
        entries:
          description: The directory's immediate children.
          type: array
          items:
            description: One file or directory.
            type: object
            properties:
              name:
                description: Entry name, not a full path.
                type: string
              kind:
                description: Whether the entry is a file or a directory.
                x-enum:
                - dir
                - file
                type: string
              size:
                description: Byte size. 0 for a directory.
                type: integer
                format: int64
              mtime:
                description: RFC3339 last-modified, or empty when the store reports none.
                type: string
            required:
            - name
            - kind
            - size
            - mtime
        total:
          description: Entries in the directory.
          type: integer
          format: int64
        offset:
          description: Where this page starts.
          type: integer
          format: int64
        limit:
          description: Maximum entries in this page.
          type: integer
          format: int64
        next_offset:
          nullable: true
          description: Null on the last page.
          type: integer
          format: int64
      required:
      - entries
      - total
      - offset
      - limit
      - next_offset
    ArtifactReclaim:
      description: An intent to swap one artifact for its replacement, recorded so the old one is dropped only once the new one is live.
      type: object
      properties:
        removed_id:
          description: The artifact being superseded.
          type: string
        added_id:
          description: The artifact replacing it.
          type: string
        version:
          description: Index version the swap belongs to.
          type: integer
          format: int64
      required:
      - removed_id
      - added_id
      - version
    ArtifactType:
      description: One kind of artifact to extract. `name` is required of a written manifest; a read echoes a stored document that lacks one rather than failing.
      type: object
      properties:
        name:
          description: What the type is called. Edge endpoints reference it, and a sqlite type's table is named after it.
          type: string
          maxLength: 64
        kind:
          description: What the artifact represents, which selects the extraction prompt. `glossary` is the exception — it reads the headings named in `sections` deterministically, with no LLM call.
          default: topic
          x-enum:
          - summary
          - topic
          - entity
          - event
          - doc
          - page
          - glossary
          type: string
        scope:
          description: How widely the extraction reaches. `document` extracts one artifact per source; `corpus` reduces mentions from across every source into one artifact per subject.
          default: corpus
          x-enum:
          - document
          - corpus
          type: string
        icon:
          description: Symbol to display beside artifacts of this kind.
          type: string
          maxLength: 64
        description:
          description: What this type should capture. Goes into the extraction prompt, so it steers the result.
          type: string
          maxLength: 512
        coverage:
          description: Topics the extraction is told to address wherever the source speaks to them.
          type: array
          items:
            description: One topic the extraction should address.
            type: string
            maxLength: 128
          maxItems: 32
        sections:
          description: Exact section headings a `glossary`-kind type reads verbatim. Ignored by every other kind.
          type: array
          items:
            description: One exact section heading to read.
            type: string
            maxLength: 128
          maxItems: 64
        min_doc_count:
          description: Overrides the manifest-level `min_doc_count` for this type.
          default: 1
          type: integer
          minimum: 1
          maximum: 64
        format:
          description: Where the artifacts of this type are written — `markdown` a prose file each, `sqlite` rows in the context's structured database.
          default: markdown
          x-enum:
          - markdown
          - sqlite
          type: string
        columns:
          description: Table schema for a `sqlite`-format type. Ignored for `markdown`. Two names that normalize to the same column collide, and the first declaration wins.
          type: array
          items:
            description: One column of the type's table.
            type: object
            properties:
              name:
                description: Column name.
                type: string
                maxLength: 64
              type:
                description: SQLite column affinity.
                default: TEXT
                x-enum:
                - TEXT
                - INTEGER
                - REAL
                - NUMERIC
                type: string
              description:
                description: What the column holds. Steers the extraction that fills it.
                type: string
                maxLength: 256
            required:
            - name
          maxItems: 64
        natural_key:
          description: Columns that identify a row uniquely, so re-curating a source upserts its rows rather than duplicating them. `sqlite`-format types only.
          type: array
          items:
            description: One column of the upsert key.
            type: string
            maxLength: 64
          maxItems: 16
      required:
      - name
    ArtifactsConfig:
      description: 'The artifact leg: knowledge an LLM distills out of the sources, as prose files or database rows. Off by default.'
      type: object
      properties:
        enabled:
          description: Whether curate extracts artifacts at all.
          default: false
          type: boolean
        artifact_model:
          description: Model tier that does the extraction. `standard` reads more carefully at a higher token cost.
          default: lite
          x-enum:
          - standard
          - lite
          type: string
        artifact_types:
          description: What kinds of artifact to extract. Nothing is extracted until at least one is declared.
          type: array
          items:
            $ref: '#/components/schemas/ArtifactType'
          maxItems: 32
        edge_types:
          description: Typed, directed relationships between artifact types, which turn the artifacts into a graph the agent can traverse.
          type: array
          items:
            $ref: '#/components/schemas/EdgeType'
          maxItems: 32
        min_doc_count:
          description: How many source documents must mention a corpus-scoped subject before it earns an artifact. Raise it to suppress one-off mentions. An artifact type may override it.
          default: 1
          type: integer
          minimum: 1
          maximum: 64
        max_tokens:
          description: Output cap for one extracted artifact, in tokens.
          default: 1500
          type: integer
          minimum: 128
          maximum: 8192
        max_doc_chars:
          description: Input cap for one extraction call, in characters. With windowing off this also caps how much of a source is read at all; everything beyond it is dropped.
          default: 60000
          type: integer
          minimum: 1000
          maximum: 2000000
        extraction_window_chars:
          description: Window size for walking a long source across several extraction calls, so its back half is covered rather than dropped. `0` opts out and reads only the head, up to `max_doc_chars`.
          default: 0
          type: integer
          minimum: 0
          maximum: 1000000
        mention_max_chars:
          description: Cap on one recorded mention — what a single document says about the subject — in characters.
          default: 400
          type: integer
          minimum: 100
          maximum: 4000
        max_mentions_per_artifact:
          description: How many mentions are fed into the pass that reduces them into one corpus-wide artifact.
          default: 40
          type: integer
          minimum: 1
          maximum: 500
        mention_context_chars:
          description: Cap on those mentions once concatenated, in characters. Applied after `max_mentions_per_artifact`.
          default: 8000
          type: integer
          minimum: 1000
          maximum: 100000
        max_artifacts_per_type:
          description: How many artifacts one type may produce. Omit for no cap.
          default: 10000
          type: integer
          minimum: 1
          maximum: 10000
    CancelTaskRequest:
      description: Optional detail about the termination. A request with no body still terminates the task.
      type: object
      properties:
        reason:
          description: Why the task is being terminated, recorded on the row.
          type: string
        target:
          description: Which part of the task to terminate. Defaults to the whole task.
          type: string
        pinecone_api_key:
          description: Task-token override; normally not needed.
          type: string
        user_token:
          description: Caller-token override; normally not needed.
          type: string
    CandidateQuery:
      description: A query the optimize run tunes toward.
      type: object
      properties:
        ask:
          description: The question to tune retrieval against.
          type: string
        answer:
          description: Used as eval ground truth
          type: string
        fallback_to_chunks:
          description: Whether answering this query had to drill from artifacts down to chunks.
          type: boolean
        latency_ms:
          description: Latency the query showed in real traffic, as a tuning baseline.
          type: number
          format: double
    ChatUsage:
      description: What a run billed on the chat seam, in tokens. Reported by the inference client, which carries the cache-token fields. Used by optimize and explore.
      type: object
      properties:
        prompt_tokens:
          description: Input tokens billed across every model.
          type: integer
          format: int64
        completion_tokens:
          description: Output tokens billed across every model.
          type: integer
          format: int64
        total_tokens:
          description: Input plus output tokens across every model.
          type: integer
          format: int64
        by_model:
          description: Keyed by the model the proxy actually dispatched to, so tier fallbacks are visible.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ModelUsage'
        cache_read_tokens:
          description: Input served without re-billing.
          type: integer
          format: int64
        cache_write_tokens:
          description: Prompt tokens written into cache.
          type: integer
          format: int64
      required:
      - prompt_tokens
      - completion_tokens
      - total_tokens
      - by_model
      - cache_read_tokens
      - cache_write_tokens
    ChunkingConfig:
      description: How a source is cut into chunks.
      type: object
      properties:
        strategy:
          description: Which structure the splitter cuts on — markdown headings, fixed-size windows, HTML elements, CSV rows, or code syntax. Pick the one that matches the corpus.
          default: markdown_heading
          x-enum:
          - markdown_heading
          - sliding_window
          - html
          - csv
          - code
          type: string
        target_size:
          description: Chunk size the splitter aims for, in tokens. Smaller chunks retrieve more precisely; larger ones carry more surrounding context.
          default: 512
          type: integer
          minimum: 64
          maximum: 4096
        overlap:
          description: Tokens each chunk repeats from its predecessor, so a passage split across a boundary is still retrievable whole.
          default: 64
          type: integer
          minimum: 0
          maximum: 1024
        respect_sections:
          description: Never cut across a section boundary, even when that leaves a chunk short of `target_size`.
          default: true
          type: boolean
    ChunksConfig:
      description: The chunk leg — sources split into passages, embedded for semantic search and optionally indexed for keyword search.
      type: object
      properties:
        enabled:
          description: Whether curate builds the chunk leg at all.
          default: true
          type: boolean
        embedding_model:
          description: Model that embeds the chunks.
          default: multilingual-e5-large
          type: string
          maxLength: 128
        chunking:
          $ref: '#/components/schemas/ChunkingConfig'
        keyword:
          description: The lexical index built alongside the vectors, for exact-term matching.
          type: object
          properties:
            enabled:
              description: Whether the lexical index is built.
              default: true
              type: boolean
    Citation:
      description: 'What a turn''s answer was grounded in. Every field is optional: a search turn cites a corpus file (`source` and its pointers), a work turn the earlier turn a fact came from (`source_path`, `query_id`, `steps`, `artifact_name`).'
      type: object
      properties:
        source:
          description: Path of the cited corpus file, relative to the source-tree root.
          type: string
        section_paths:
          description: Heading paths within the source, when known. One inner array per cited section, outermost heading first.
          type: array
          items:
            description: One heading path, outermost heading first.
            type: array
            items:
              description: One heading in the path.
              type: string
        pages:
          description: 1-based page numbers, for sources that paginate.
          type: array
          items:
            description: A 1-based page number.
            type: integer
            format: int64
        score:
          description: Retrieval score — how well this source answered the ask. Comparable only within one turn.
          type: number
          format: double
        grounding:
          description: The quoted span the answer rests on.
          type: string
        kind:
          description: Which index the citation came out of, e.g. `chunk` or `artifact`.
          type: string
        source_path:
          description: Work contexts — path of the artifact the fact was consolidated into.
          type: string
        query_id:
          description: Work contexts — the earlier turn the fact was learned from.
          type: string
        steps:
          description: Work contexts — step ids within that earlier turn.
          type: array
          items:
            description: A step id within the cited turn.
            type: string
        artifact_name:
          description: Work contexts — name of the cited artifact.
          type: string
        sources:
          description: The documents a cited artifact was derived from.
          type: array
          items:
            description: One document the artifact was derived from.
            type: string
    ConnectorItem:
      description: One file or folder in the provider's tree, as offered for import.
      type: object
      properties:
        id:
          description: Provider-side id. Pass it as `folder` or in `files` to import.
          type: string
        name:
          description: Display name at the provider.
          type: string
        type:
          description: Whether the item is a file or a folder.
          x-enum:
          - file
          - folder
          type: string
        size:
          description: Files only, when the provider reports it
          type: integer
          format: int64
      required:
      - id
      - name
      - type
    ConnectorItemList:
      description: The folder that was browsed plus its children.
      type: object
      properties:
        folder:
          description: The folder id that was browsed
          type: string
        items:
          description: The folder's files and subfolders.
          type: array
          items:
            $ref: '#/components/schemas/ConnectorItem'
      required:
      - folder
      - items
    ConnectorList:
      description: The linked connectors.
      type: array
      items:
        $ref: '#/components/schemas/ConnectorView'
    ConnectorOauthStart:
      description: Where to send the user to approve access.
      type: object
      properties:
        authorize_url:
          description: The provider's consent page. Open it in a browser.
          type: string
      required:
      - authorize_url
    ConnectorView:
      description: A linked project connector, secrets stripped. There is no `config` field — the domain model carries a provider-specific blob, but no provider populates one today.
      type: object
      properties:
        id:
          description: Connector id, used to import from it.
          type: string
        provider:
          description: Which external system this links to, e.g. `box`.
          type: string
        account_label:
          nullable: true
          description: Display label distinguishing two links to the same provider. Null when none was given.
          type: string
        created_at:
          description: When the connector was linked.
          type: string
          format: date-time
        updated_at:
          description: When the connector last changed.
          type: string
          format: date-time
      required:
      - id
      - provider
      - created_at
      - updated_at
    ContextConnectorList:
      description: The connectors, each with its per-context enabled flag.
      type: array
      items:
        $ref: '#/components/schemas/ContextConnectorView'
    ContextConnectorView:
      description: A project connector as one context sees it, carrying that context's enabled flag.
      allOf:
      - $ref: '#/components/schemas/ConnectorView'
      - description: A project connector with its per-context enabled flag. Flat, not nested — the flag sits alongside the connector's own fields.
        type: object
        properties:
          enabled:
            description: Whether this context may import from the connector.
            type: boolean
        required:
        - enabled
    ContextKind:
      description: How the context is built. `search` — built from source documents, and must be curated before it can be queried. `work` — built from traces of work done, queryable immediately, consolidated by `groom` rather than `curate`.
      default: search
      x-enum:
      - search
      - work
      type: string
    ContextList:
      description: The contexts, newest first.
      type: array
      items:
        $ref: '#/components/schemas/ContextResponse'
    ContextResponse:
      description: What context endpoints return — the stored context plus the lifecycle flags derived from its in-flight tasks.
      type: object
      properties:
        id:
          description: Stable UUID. Accepted anywhere `{slug}` is.
          type: string
        slug:
          description: URL-safe name, unique within the project. Mutable via `PUT`.
          type: string
        name:
          description: Human-readable display name.
          type: string
        kind:
          $ref: '#/components/schemas/ContextKind'
        workspace:
          description: Owning workspace. Absent off a workspace-enabled cluster.
          type: string
        created_by:
          description: Principal that created the context.
          type: string
        description:
          nullable: true
          description: Free-text summary of what the context holds.
          type: string
        guide:
          description: High-level standing instructions the query runtime reads on every turn.
          type: string
        manifest:
          description: Pinned manifest document. Absent when the context runs on validator defaults.
          allOf:
          - $ref: '#/components/schemas/Manifest'
        semantic_index:
          nullable: true
          description: Host of the index backing this context's vector retrieval. Null until a curate resolves one.
          type: string
        keyword_index:
          nullable: true
          description: Host of the index backing keyword retrieval. The same host as `semantic_index` today — the two names are separate seams over one index.
          type: string
        is_optimizing:
          description: An optimize task is in flight.
          type: boolean
        optimize_task_id:
          nullable: true
          description: The optimize task — the running one, or the last to finish.
          type: string
        optimize_score:
          nullable: true
          description: Eval pass rate the last optimize's best iteration scored.
          type: number
          format: double
        optimize_iterations:
          nullable: true
          description: How many candidate manifests the last run tried.
          type: integer
        last_optimized_at:
          nullable: true
          description: When an optimize last persisted a tuned manifest.
          type: string
          format: date-time
        last_curated_at:
          nullable: true
          description: When a curate last flipped a new index version live.
          type: string
          format: date-time
        has_sources:
          description: The source tree holds at least one file. False blocks curate.
          type: boolean
        last_source_import_at:
          nullable: true
          description: When sources were last staged by an upload or import.
          type: string
          format: date-time
        is_curating:
          description: A curate task is in flight.
          type: boolean
        curate_task_id:
          nullable: true
          description: The curate task — the running one, or the last to finish.
          type: string
        is_importing:
          description: An import task is in flight.
          type: boolean
        import_task_id:
          nullable: true
          description: The import task — the running one, or the last to finish.
          type: string
        is_exploring:
          description: An explore task is in flight.
          type: boolean
        explore_task_id:
          nullable: true
          description: The explore task — the running one, or the last to finish.
          type: string
        is_restoring:
          description: A restore task is in flight.
          type: boolean
        restore_task_id:
          nullable: true
          description: The restore task — the running one, or the last to finish.
          type: string
        manifest_suggestion:
          $ref: '#/components/schemas/ManifestSuggestion'
        sample_queries:
          description: Example questions the curated corpus can answer, written by the last curate.
          type: array
          items:
            description: One example question.
            type: string
        is_grooming:
          description: A groom task is in flight. Work contexts only.
          type: boolean
        groom_task_id:
          description: The groom task — the running one, or the last to finish.
          type: string
        groom_artifact_count:
          description: Artifacts the last groom left in the work context.
          type: integer
          format: int64
        last_groomed_at:
          description: When a groom last consolidated the work context.
          type: string
          format: date-time
        created_at:
          description: When the context was created.
          type: string
          format: date-time
        updated_at:
          description: When the context last changed.
          type: string
          format: date-time
        stats:
          description: Aggregate task counters. Populated only on the list endpoint.
          allOf:
          - $ref: '#/components/schemas/ContextStats'
      required:
      - id
      - slug
      - name
      - kind
      - created_by
      - description
      - is_optimizing
      - has_sources
      - is_curating
      - is_importing
      - is_exploring
      - is_restoring
      - is_grooming
      - created_at
      - updated_at
    ContextStats:
      description: Aggregate counters over every task this context has ever run.
      type: object
      properties:
        tasks_total:
          description: Tasks this context has ever run.
          type: integer
          format: int64
        tasks_active:
          description: Tasks in a non-terminal state.
          type: integer
          format: int64
        tasks_completed:
          description: Tasks that finished successfully.
          type: integer
          format: int64
        tasks_failed:
          description: Tasks that ended in failure.
          type: integer
          format: int64
        tasks_cancelled:
          description: Runs stopped before they finished.
          type: integer
          format: int64
        tokens_total:
          description: Prompt plus completion tokens across every task.
          type: integer
          format: int64
        runtime_seconds:
          description: Summed container runtime across every task.
          type: integer
          format: int64
      required:
      - tasks_total
      - tasks_active
      - tasks_completed
      - tasks_failed
      - tasks_cancelled
      - tokens_total
      - runtime_seconds
    CorpusGroup:
      description: A set of sources the corpus pass treats as one subject, so their mentions reduce into a single artifact.
      type: object
      properties:
        group_key:
          description: Stable identifier the reduce pass groups on.
          type: string
        member_sources:
          description: Source paths in the group.
          type: array
          items:
            description: One source path in the group.
            type: string
        canonical_name:
          description: The name the group's artifact is written under.
          type: string
        membership_hash:
          description: Hash of the membership. A change here means the group must be re-reduced.
          type: string
        added_version:
          description: Index version the group was added in.
          type: integer
          format: int64
      required:
      - group_key
      - member_sources
      - canonical_name
      - membership_hash
      - added_version
    CreateConnectorRequest:
      description: The provider credential to store.
      type: object
      properties:
        api_key:
          description: The provider's API key. Stored encrypted and never returned.
          type: string
        account_label:
          description: Optional display label
          type: string
      required:
      - api_key
    CreateContextRequest:
      description: What a new context is created with. Only `slug` and `name` are required.
      type: object
      properties:
        slug:
          description: 3–64 chars, lowercase alnum + hyphens, starts with a letter
          type: string
        name:
          description: 1–128 chars
          type: string
        description:
          description: Free-text summary of what the context will hold.
          type: string
        guide:
          description: High-level standing instructions for the query runtime.
          type: string
        manifest:
          description: Seed manifest (validated against the manifest schema)
          allOf:
          - $ref: '#/components/schemas/Manifest'
        kind:
          $ref: '#/components/schemas/ContextKind'
        pinecone_api_key:
          description: Pinecone API key used to provision the context's managed index. Omit it under BYOC, where the deployment holds its own credential.
          type: string
      required:
      - slug
      - name
    CreateQueryFeedbackRequest:
      description: The rating to record.
      type: object
      properties:
        rating:
          description: Thumbs up or down.
          x-enum:
          - up
          - down
          type: string
        comment:
          description: Optional, trimmed
          type: string
          maxLength: 2000
      required:
      - rating
    CurateContextRequest:
      description: Optional overrides for the run. `{}` is a valid incremental curate.
      type: object
      properties:
        force:
          description: Full rebuild rather than incremental
          default: false
          type: boolean
        batch_size:
          description: How many sources curate reads per pass.
          type: integer
        scope:
          description: Curate scope recorded on the task input
          type: string
        trigger:
          description: Provenance label recorded on the task input
          type: string
        model:
          description: Model-id override for the curate runtime
          type: string
        pinecone_api_key:
          description: Task-token override; normally not needed
          type: string
    CurateInput:
      title: Curate
      description: What a curate run was started with.
      type: object
      properties:
        trigger:
          description: What started the run, e.g. `manual`, `reconcile`, `restore`, or `resume`.
          type: string
        force:
          description: Full rebuild rather than incremental.
          type: boolean
        scope:
          description: What the run covered, e.g. `full`, `reconcile`, or `restore`.
          type: string
        batch_size:
          description: Sources processed per batch.
          type: integer
        models:
          description: Model-id overrides for the curate runtime.
          type: array
          items:
            description: A catalog model id or tier name.
            type: string
        legs:
          description: Set to `["chunks"]` to gate the run to the chunk + keyword indices, skipping artifact extraction.
          type: array
          items:
            description: A leg name, e.g. `chunks`.
            type: string
        artifacts_reset:
          description: Drop the existing artifacts and re-extract from scratch.
          type: boolean
        skip_corpus_aggregation:
          description: Skip the corpus-wide artifact pass, leaving only per-document extraction.
          type: boolean
        claimed_version:
          description: What a drained predecessor had already reserved.
          type: integer
          format: int64
      required:
      - trigger
      - force
      - scope
    CurateManifest:
      description: What curate builds out of the sources — the chunk leg, the artifact leg, or both.
      type: object
      properties:
        chunks:
          $ref: '#/components/schemas/ChunksConfig'
        artifacts:
          $ref: '#/components/schemas/ArtifactsConfig'
    CurateManifestTuneOutput:
      title: Curate manifest_tune
      description: The post-optimize artifacts re-eval. Targets optimize trial namespaces, so `flipped` is always false and `mode` is always `manifest_tune`.
      type: object
      properties:
        status:
          description: How the run ended.
          type: string
        flipped:
          description: Always false — the run targets optimize trial namespaces, not the live index.
          x-enum:
          - false
          type: boolean
        versioned:
          description: Whether the run wrote version stamps.
          type: boolean
        mode:
          description: Always `manifest_tune`.
          x-enum:
          - manifest_tune
          type: string
        usage:
          $ref: '#/components/schemas/CurateUsage'
        delta:
          description: What the re-eval changed.
          type: object
          properties:
            artifacts_reevaluated:
              description: Artifacts re-extracted under the tuned manifest. Replaces the source counts a normal run reports.
              type: integer
              format: int64
            failed:
              description: Sources that could not be re-evaluated.
              type: integer
              format: int64
            failed_sources:
              description: Paths of the failed sources, capped in length.
              type: array
              items:
                description: A source path that failed.
                type: string
            failed_sources_truncated:
              description: Whether failed_sources was capped and the full list spilled to a file.
              type: boolean
            failed_sources_file:
              description: Where the full failed-sources list was written when truncated.
              type: string
            corpus_artifacts:
              description: Artifacts written by the corpus-wide reduce pass.
              type: integer
              format: int64
            corpus_edges:
              description: Edges written by that pass.
              type: integer
              format: int64
            chunks_created:
              description: Chunks written for the first time.
              type: integer
              format: int64
            chunks_updated:
              description: Chunks rewritten from changed sources.
              type: integer
              format: int64
            artifacts_created:
              description: Per-document artifacts written for the first time.
              type: integer
              format: int64
            artifacts_updated:
              description: Per-document artifacts rewritten from changed sources.
              type: integer
              format: int64
            chunks_screened:
              description: Chunks rejected by the quality screen.
              type: integer
              format: int64
            artifacts_screened:
              description: Per-document artifacts rejected by the quality screen.
              type: integer
              format: int64
            images_skipped_no_vision:
              description: Images left unread because the configured model cannot see.
              type: integer
              format: int64
            sources_skipped_unreadable:
              description: Sources no leg could read, skipped rather than failed.
              type: integer
              format: int64
            artifacts_errored:
              description: Extraction calls that failed outright.
              type: integer
              format: int64
            sources_content_truncated:
              description: Sources whose text was cut at the input cap.
              type: integer
              format: int64
          required:
          - artifacts_reevaluated
          - failed
          - failed_sources
          - failed_sources_truncated
          - failed_sources_file
          - corpus_artifacts
          - corpus_edges
          - chunks_created
          - chunks_updated
          - artifacts_created
          - artifacts_updated
          - chunks_screened
          - artifacts_screened
          - images_skipped_no_vision
          - sources_skipped_unreadable
          - artifacts_errored
          - sources_content_truncated
      required:
      - status
      - flipped
      - versioned
      - mode
      - usage
      - delta
    CurateNoopOutput:
      title: Curate no-op
      description: Nothing changed since the last run; `delta` is the literal string `empty` rather than a count block, which is what makes this a shape of its own.
      type: object
      properties:
        status:
          description: How the run ended.
          type: string
        flipped:
          description: Whether a new index version was made live.
          type: boolean
        versioned:
          description: Whether the run wrote version stamps.
          type: boolean
        mode:
          description: Set to `incremental` when the context has a manifest, `full` otherwise.
          type: string
        scope:
          description: What the run would have covered.
          type: string
        delta:
          description: Always the literal string `empty`.
