      - flipped
      - versioned
      - mode
      - scope
      - delta
    CurateRunOutput:
      title: Curate run
      description: What a curate run built. The index it wrote goes live only when `flipped` is true.
      type: object
      properties:
        status:
          description: How the run ended.
          type: string
        flipped:
          description: Whether the new index version was made live. False means queries still read the previous one.
          type: boolean
        versioned:
          description: Whether the run wrote version stamps.
          type: boolean
        mode:
          description: Set to `incremental` when the context has a manifest, `full` otherwise.
          type: string
        scope:
          description: What the run covered, e.g. `full` or `reconcile`.
          type: string
        images_skipped_no_vision:
          description: Images left unread because the configured model cannot see.
          type: integer
          format: int64
        sources_skipped_unreadable:
          description: Sources no leg could read, skipped rather than failed.
          type: integer
          format: int64
        usage:
          $ref: '#/components/schemas/CurateUsage'
        sample_queries:
          description: Example questions the corpus can answer
          type: array
          items:
            description: One example question.
            type: string
        delta:
          description: What the run changed, counted per leg.
          type: object
          properties:
            new:
              description: Sources not seen by a previous curate.
              type: integer
              format: int64
            changed:
              description: Sources whose content hash moved.
              type: integer
              format: int64
            deleted:
              description: Sources dropped from the index.
              type: integer
              format: int64
            processed:
              description: Sources the run actually read.
              type: integer
              format: int64
            failed:
              description: Sources that could not be curated.
              type: integer
              format: int64
            failed_sources:
              description: Paths of the failed sources, capped in length.
              type: array
              items:
                description: A source path that failed.
                type: string
            failed_sources_truncated:
              description: Whether failed_sources was capped and the full list spilled to a file
              type: boolean
            failed_sources_file:
              description: Where the full failed-sources list was written when truncated
              type: string
            corpus_artifacts:
              description: Artifacts written by the corpus-wide reduce pass.
              type: integer
              format: int64
            corpus_edges:
              description: Edges written by that pass.
              type: integer
              format: int64
            corpus_artifacts_screened:
              description: Corpus artifacts rejected by the quality screen.
              type: integer
              format: int64
            screened:
              description: Sum of the per-leg and corpus screen counts
              type: integer
              format: int64
            chunks_created:
              description: Chunks written for the first time.
              type: integer
              format: int64
            chunks_updated:
              description: Chunks rewritten from changed sources.
              type: integer
              format: int64
            artifacts_created:
              description: Per-document artifacts written for the first time.
              type: integer
              format: int64
            artifacts_updated:
              description: Per-document artifacts rewritten from changed sources.
              type: integer
              format: int64
            chunks_screened:
              description: Chunks rejected by the quality screen.
              type: integer
              format: int64
            artifacts_screened:
              description: Per-document artifacts rejected by the quality screen.
              type: integer
              format: int64
            images_skipped_no_vision:
              description: Images left unread because the configured model cannot see.
              type: integer
              format: int64
            sources_skipped_unreadable:
              description: Sources no leg could read, skipped rather than failed.
              type: integer
              format: int64
            artifacts_errored:
              description: Extraction calls that failed outright.
              type: integer
              format: int64
            sources_content_truncated:
              description: Sources whose text was cut at the input cap, so their tail went unread.
              type: integer
              format: int64
          required:
          - new
          - changed
          - deleted
          - processed
          - failed
          - failed_sources
          - failed_sources_truncated
          - failed_sources_file
          - corpus_artifacts
          - corpus_edges
          - corpus_artifacts_screened
          - screened
          - chunks_created
          - chunks_updated
          - artifacts_created
          - artifacts_updated
          - chunks_screened
          - artifacts_screened
          - images_skipped_no_vision
          - sources_skipped_unreadable
          - artifacts_errored
          - sources_content_truncated
      required:
      - status
      - flipped
      - versioned
      - mode
      - scope
      - images_skipped_no_vision
      - sources_skipped_unreadable
      - usage
      - sample_queries
      - delta
    CurateUsage:
      description: 'Curate''s token rollup: the chat-seam totals plus the embed/rerank seam (`embed_by_model`). It does not carry the cache-token fields.'
      type: object
      properties:
        prompt_tokens:
