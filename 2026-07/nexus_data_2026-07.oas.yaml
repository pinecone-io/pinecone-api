    QueryTerminalEvent:
      title: Response completed / failed / cancelled
      description: How the turn ended. The last progress frame; a final unstamped `query` frame carrying the whole turn follows it.
      type: object
      properties:
        type:
          description: Identifies the event, and which terminal state was reached.
          x-enum:
          - response.completed
          - response.failed
          - response.cancelled
          type: string
        query_id:
          description: The turn that ended.
          type: string
        error:
          description: Failure detail. Set on the failed and cancelled events only.
          type: string
    QueryTraceEvent:
      title: Response trace
      description: The turn's trace blob has landed.
      type: object
      properties:
        type:
          description: Identifies the event.
          x-enum:
          - response.trace
          type: string
        query_id:
          description: The turn the trace belongs to.
          type: string
        trace_ref:
          description: Blob key of the persisted trace.
          type: string
    RestoreCompletedOutput:
      title: Restore completed
      description: The target holds the pack's sources, knowledge, and manifest. Its index stays empty until curated.
      type: object
      properties:
        state:
          description: Which stage of the restore this report describes.
          type: string
        pack_filename:
          description: The pack archive's file name.
          type: string
        pack_size:
          description: How large the archive is on disk.
          type: integer
          format: int64
        target_context_id:
          description: The context the pack is restored into.
          type: string
        target_slug:
          description: URL-safe name of the context being written into.
          type: string
        sources_staged:
          description: Source files written into the target.
          type: integer
          format: int64
        knowledge_staged:
          description: Knowledge files written into the target.
          type: integer
          format: int64
        manifest_set:
          description: Whether the pack's manifest was pinned onto the target.
          type: boolean
        corpus_groups_set:
          description: Corpus groups written into the target's curation ledger.
          type: integer
          format: int64
        sample_queries:
          description: Sample queries carried from the pack onto the target. Empty when the pack had none.
          type: array
          items:
            description: One sample query set on the target.
            type: string
        started_at:
          description: When the restore started.
          type: string
        completed_at:
          description: When the restore finished.
          type: string
      required:
      - state
      - pack_filename
      - pack_size
      - target_context_id
      - target_slug
      - sources_staged
      - knowledge_staged
      - manifest_set
      - corpus_groups_set
      - sample_queries
      - started_at
      - completed_at
    RestoreInput:
      title: Restore
      description: What a restore run was started with.
      type: object
      properties:
        pack_key:
          description: Object-store key of the pack being restored.
          type: string
        pack_filename:
          description: The pack archive's file name.
          type: string
        target_context_id:
          description: The already-created context the pack is restored into.
          type: string
        target_slug:
          description: URL-safe name of the context being written into.
          type: string
        target_name:
          description: Human-readable label of the context being written into.
          type: string
        sample_queries:
          description: Sample queries to seed the target with, taken from the pack. Absent on a pack that carried none.
          type: array
          items:
            description: One sample query carried over from the pack.
            type: string
      required:
      - pack_key
      - pack_filename
      - target_context_id
      - target_slug
      - target_name
    RestoreRunningOutput:
      title: Restore running
      description: 'A restore''s progress: the initial claim, the fetch, the unzip, then periodic staging. `state` is `running` on all four, so key presence is what tells them apart, and only `state` is on every one.'
      type: object
      properties:
        state:
          description: Always `running`. Which report this is shows in the keys it carries, not here.
          x-enum:
          - running
          type: string
        pack_filename:
          description: The pack archive's file name. Absent on the staging report.
          type: string
        pack_size:
          description: Byte size of the pack archive. Present once it has been fetched.
          type: integer
          format: int64
        target_context_id:
          description: The context the pack is restored into. Absent on the staging report.
          type: string
        target_slug:
          description: Slug of that target context. Absent from the unzip and staging reports.
          type: string
        started_at:
          description: When the restore started. Present on the first report only.
          type: string
        stage_progress:
          description: How far the current phase has got. Absent on the first report, before any phase begins.
          allOf:
          - $ref: '#/components/schemas/StageProgress'
        sources_count:
          description: Source files found in the pack. Present once it has been expanded.
          type: integer
          format: int64
        knowledge_count:
          description: Knowledge files found in the pack. Present once it has been expanded.
          type: integer
          format: int64
      required:
      - state
    SeamUsage:
      description: 'Per-model embed/rerank-seam counts: billed per token (embed) or per request (rerank).'
      type: object
      properties:
        kind:
          description: Which seam this row counts, and therefore which of the two count fields is meaningful.
          x-enum:
          - embed
          - rerank
          type: string
        tier:
          description: Which tier resolved to this model.
          type: string
        embed_tokens:
          description: 'Tokens embedded. Meaningful for `kind: embed`.'
          type: integer
          format: int64
        rerank_units:
          description: 'Rerank requests made. Meaningful for `kind: rerank`.'
          type: integer
          format: int64
      required:
      - kind
      - tier
      - embed_tokens
      - rerank_units
    SearchCcTurnCompletedOutput:
      title: Search-as-code completed
      description: The search-as-code path reports a step count where the others report `output_json`.
      type: object
      properties:
        status:
          description: How the turn ended.
          type: string
        query_id:
          description: The turn this task answered.
          type: string
        answer:
          description: The answer text.
          type: string
        citations:
          description: Cited source paths.
          type: array
          items:
            description: A cited source path.
            type: string
        latency_ms:
          description: Wall time for the turn.
          type: integer
          format: int64
        steps:
          description: Reasoning steps the turn ran.
          type: integer
          format: int64
      required:
      - status
      - query_id
      - answer
      - citations
      - latency_ms
      - steps
    SearchInput:
      title: Search / search_cc / search_rag / work
      description: One shape for the whole search family — the same payload is written whichever of them a turn resolves to.
      type: object
      properties:
        session_id:
          description: The session the turn runs in.
          type: string
        query_id:
          description: The turn this task serves.
          type: string
        ask:
          description: Title fallback for the tasks UI; empty when the turn had no user message
          type: string
        messages:
          description: The conversation history handed to the runtime.
          type: array
          items:
            description: One message of history.
            type: object
            properties:
              role:
                description: Who sent it, e.g. `user`.
                type: string
              content:
                description: The message text.
                type: string
            required:
            - role
            - content
        models:
          description: The session's model fallback list, in preference order.
          type: array
          items:
            description: A catalog model id or tier name.
            type: string
        tools:
          description: Tool names the turn may call.
          type: array
          items:
            description: A tool name.
            type: string
        shape:
          nullable: true
          description: JSON Schema the answer must conform to. Null on a free-text turn.
          type: object
          additionalProperties: true
        instructions:
          nullable: true
          description: The session's system prompt. Null when none was pinned.
          type: string
        scope:
          description: Context ids the turn searches.
          type: array
          items:
            description: A context id the turn searched.
            type: string
        turn_timeout_seconds:
          description: Runtime budget for this one turn.
          type: integer
          format: int64
        retrieval:
          description: The turn's retrieval controls.
          type: object
          properties:
            retrieval_only:
              nullable: true
              description: Skip synthesis and return the hits. Null where the caller omitted it.
              type: boolean
            pointers_only:
              nullable: true
              description: Skip synthesis and return pointers only. Null where the caller omitted it.
              type: boolean
            chunks_only:
              nullable: true
              description: Narrow retrieval to chunks. Null where the caller omitted it.
              type: boolean
            artifacts_only:
              nullable: true
              description: Narrow retrieval to artifacts. Null where the caller omitted it.
              type: boolean
            max_retrieved:
              nullable: true
              description: Cap on retrieved items. Null where the caller omitted it.
              type: integer
              format: int64
            max_retrieved_chars:
              nullable: true
              description: Cap on per-item text length. Null where the caller omitted it.
              type: integer
              format: int64
            compose:
              nullable: true
              description: Whether to synthesize an answer. Null where the caller omitted it.
              type: boolean
            max_steps:
              nullable: true
              description: Cap on the agent's tool-loop steps. Null where the caller omitted it.
              type: integer
              format: int64
            thinking_level:
              nullable: true
              description: Reasoning depth. Null where the caller omitted it.
              x-enum:
              - minimal
              - low
              - medium
              - high
              type: string
          required:
          - retrieval_only
          - pointers_only
          - chunks_only
          - artifacts_only
          - max_retrieved
          - max_retrieved_chars
          - compose
          - max_steps
          - thinking_level
        comparison_group:
          nullable: true
          description: The Compare run this turn belongs to. Null on a normal single query.
          type: string
      required:
      - session_id
      - query_id
      - ask
      - messages
      - models
      - tools
      - shape
      - instructions
      - scope
      - turn_timeout_seconds
      - comparison_group
    SearchManifest:
      description: Standing instructions for the query runtime, pinned on the context rather than sent per turn.
      type: object
      properties:
        instructions:
          description: The context's default system prompt, applied to every turn in scope. A session's own `system_prompt` appends to it rather than replacing it.
          type: string
    SearchTurnCompletedOutput:
      title: Search / search_rag completed
      description: What a finished search turn's task reports. The turn itself, with its steps and structured citations, is at `GET /queries/{query_id}`.
      type: object
      properties:
        status:
          description: How the turn ended.
          type: string
        query_id:
          description: The turn this task answered.
          type: string
        answer:
          description: The answer text.
          type: string
        output_json:
          nullable: true
          description: Structured answer when the turn carried a shape, or the hits on a retrieval-only turn. Absent otherwise.
          type: object
          additionalProperties: true
        citations:
          description: Cited source paths. The turn carries the structured form.
          type: array
          items:
            description: A cited source path.
            type: string
        latency_ms:
          description: Wall time for the turn.
          type: integer
          format: int64
        unknown_models:
          description: Model selections dropped as unknown before dispatch, so a caller whose pin was silently ignored can see it. Absent when nothing was dropped.
          type: array
          items:
            description: A requested model id or tier name the project's catalog does not carry.
            type: string
      required:
      - status
      - query_id
      - answer
      - citations
      - latency_ms
    SearchTurnFailedOutput:
      title: Search failed
      description: What a search turn reports when it could not answer.
      type: object
      properties:
        status:
          description: How the turn ended.
          type: string
        query_id:
          description: The turn that failed.
          type: string
        error:
          description: Why the turn failed.
          type: string
      required:
      - status
      - query_id
      - error
    Session:
      description: A project-owned conversation thread of queries. Its scope and configuration are pinned when the first turn creates it and cannot be changed afterwards.
      type: object
      properties:
        id:
          description: Session id, `ses_<uuid>`.
          type: string
        project_id:
          description: The Pinecone project that owns the session.
          type: string
        workspace:
          description: Owning workspace. Absent off a workspace-enabled cluster.
          type: string
        created_by:
          description: Principal whose first turn created the session.
          type: string
        scope:
          description: Pinned context UUIDs (1–10) every turn searches.
          type: array
          items:
            description: A pinned context UUID.
            type: string
        title:
          nullable: true
          description: Display title derived from the opening ask. Null until one is written.
          type: string
        system_prompt:
          nullable: true
          description: Instructions pinned at session creation. Null when none were given.
          type: string
        guardrails:
          nullable: true
          description: Guardrails pinned at session creation. Null when none were given.
          type: string
        models:
          description: Pinned model fallback list, in preference order.
          type: array
          items:
            description: A catalog model id or tier name.
            type: string
        tools:
          description: Tool names the session's turns may call.
          type: array
          items:
            description: A tool name.
            type: string
        workflow:
          nullable: true
          description: The workflow this session's turns run
          type: string
        last_query_id:
          nullable: true
          description: The most recent turn. Null on a session with no turns yet.
          type: string
        created_at:
          description: When the session was created.
          type: string
          format: date-time
        updated_at:
          description: When the session last changed.
          type: string
          format: date-time
      required:
      - id
      - project_id
      - created_by
      - scope
      - models
      - tools
      - created_at
      - updated_at
    SessionList:
      description: The sessions, newest first.
      type: object
      properties:
        sessions:
          description: The conversation threads.
          type: array
          items:
            $ref: '#/components/schemas/Session'
        queries_active:
          description: Query turns in flight project-wide at the time of the read. Present only when the request asked for it with `queries_active=true`.
          type: integer
          format: int64
      required:
      - sessions
    SessionWithQueries:
      description: The session, with its turns.
      allOf:
      - $ref: '#/components/schemas/Session'
      - description: The turns added on top of the session row.
        type: object
        properties:
          queries:
            description: The session's turns, oldest first.
            type: array
            items:
              $ref: '#/components/schemas/Query'
        required:
        - queries
    SourceFileManifest:
      description: Every source object with its size and modification time.
      type: object
      properties:
        files:
          description: The source objects.
          type: array
          items:
            description: One source object.
            type: object
            properties:
              path:
                description: Path relative to the source-tree root.
                type: string
              size:
                description: Byte size of the stored object.
                type: integer
                format: int64
              last_modified:
                nullable: true
                description: Null when the store reports no modification time.
                type: string
                format: date-time
            required:
            - path
            - size
            - last_modified
        total:
          description: Number of entries in `files`.
          type: integer
          format: int64
      required:
      - files
      - total
    SourceManifestEntry:
      description: What curate recorded about one source. The hash is what makes an incremental curate possible — a source whose hash is unchanged is skipped.
      type: object
      properties:
        hash:
          description: Content hash of the source as curated.
          type: string
        curated_at:
          description: When this source was last curated.
          type: string
          format: date-time
        size:
          description: Byte size at curate time.
          type: integer
          format: int64
        mtime:
          nullable: true
          description: Source modification time at curate time. Null when the store reported none.
          type: string
          format: date-time
      required:
      - hash
      - curated_at
      - size
    SourceRemoved:
      description: A deferred whole-source delete tombstone. The source's index entries are dropped on the next curate rather than at delete time.
      type: object
      properties:
        removed_version:
          description: Index version the delete was recorded against.
          type: integer
          format: int64
        removed_at:
          nullable: true
          description: When the delete was requested.
          type: string
          format: date-time
      required:
      - removed_version
    SourceStats:
      description: Source-tree counts, plus the caps and the usage against them where source limits apply.
      allOf:
      - $ref: '#/components/schemas/FileStats'
      - description: The five quota fields travel together and are all absent — never null — where source limits are disabled and no cap applies.
        type: object
        properties:
          max_files_per_context:
            description: Upper bound on how many source objects may be staged.
            type: integer
            format: int64
          max_bytes_per_context:
            description: Total-byte cap for this context.
            type: integer
            format: int64
          max_bytes_per_file:
            description: Upper bound on one stored object.
            type: integer
            format: int64
          used_files:
            description: Files counted against `max_files_per_context`.
            type: integer
            format: int64
          used_bytes:
            description: Bytes counted against `max_bytes_per_context`.
            type: integer
            format: int64
    StageProgress:
      description: How far one restore phase has got.
      type: object
      properties:
        phase:
          description: Which phase is running, e.g. `stage_sources`.
          type: string
        done:
          description: Items finished in this phase.
          type: integer
          format: int64
        total:
          description: Items this phase will process.
          type: integer
          format: int64
      required:
      - phase
      - done
      - total
    StateFailedOutput:
      title: State-keyed failure
      description: The pack / restore terminal-failure convention.
      type: object
      properties:
        state:
          description: How the run ended.
          type: string
        error:
          description: What went wrong.
          type: string
      required:
      - state
      - error
    StatusErrorOutput:
      title: Status-keyed failure
      description: 'What a groom or curate reports when it fails terminally: best-effort detail on a task left running so it can be resumed.'
      type: object
      properties:
        status:
          description: How the run ended.
          type: string
        error:
          description: What went wrong.
          type: string
      required:
      - status
      - error
    StepCode:
      description: A step's generated code, capped. Either the source string alone or a `{language, source}` document.
      oneOf:
      - title: Source
        description: The source string alone, as later rows store it.
        type: string
      - title: Document
        description: The language-tagged form earlier rows store.
        type: object
        properties:
          language:
            description: Language the code is written in.
            type: string
          source:
            description: The code itself.
            type: string
    StepCost:
      description: The step's incremental token and latency cost — deltas against the running turn cursor, not totals. The cache fields are tracked only on the search-as-code path.
      type: object
      properties:
        tokens_in:
          description: The step's input tokens.
          type: integer
          format: int64
        tokens_out:
          description: The step's output tokens.
          type: integer
          format: int64
        decide_ms:
          description: Time spent choosing what to do.
          type: integer
          format: int64
        execute_ms:
          description: Time spent running the tool calls it chose.
          type: integer
          format: int64
        tokens_in_cached:
          description: Input tokens served from the prompt cache.
          type: integer
          format: int64
        tokens_in_cache_write:
          description: Input tokens written into the prompt cache.
          type: integer
          format: int64
        tokens_in_fresh:
          description: Input tokens neither cached nor cache-written.
          type: integer
          format: int64
    StepStrategy:
      description: The retrieval approach the step picked.
      type: object
      properties:
        kind:
          description: Strategy family, e.g. `artifacts_first`.
          type: string
        fns:
          description: Tool functions the strategy calls.
          type: array
          items:
            description: A tool function name.
            type: string
        label:
          description: Display label for the strategy.
          type: string
        scope:
          description: Context ids the strategy searched.
          type: array
          items:
            description: A context id the strategy searched.
            type: string
    StepTruncation:
      description: What a clamp shed from an oversized step event.
      type: object
      properties:
        truncated:
          description: Whether the clamp fired at all.
          type: boolean
        dropped_documents:
          description: Retrieved documents shed from the event.
          type: integer
          format: int64
        dropped_tool_calls:
          description: How many calls the clamp discarded.
          type: integer
          format: int64
    TaskFileListing:
      description: A task's file listing. Which branch answers depends on whether the task's files are still live or already archived.
      oneOf:
      - $ref: '#/components/schemas/ArchivedFileListing'
      - $ref: '#/components/schemas/LiveFileListing'
    TaskFileMetadata:
      description: A stat on one task file — the archived or the live shape, depending on whether the task still has a container.
      oneOf:
      - title: Archived
        description: Read after the task's files were archived.
        type: object
        properties:
          is_dir:
            description: Whether the object is a directory.
            type: boolean
          is_file:
            description: Whether the object is a regular file.
            type: boolean
          size:
            description: Byte size.
            type: integer
            format: int64
          modified:
            nullable: true
            description: Unix seconds. Null when the store reports none.
            type: integer
            format: int64
        required:
        - is_dir
        - is_file
        - size
        - modified
      - title: Live
        description: A `stat` in the running container.
        type: object
        properties:
          kind:
            description: 'Entry kind: `file`, `dir` or `symlink` when the stat is recognized, and the raw stat word otherwise.'
            type: string
          size:
            description: Byte size.
            type: integer
            format: int64
          mode:
            description: POSIX permission bits, as reported by the container.
            type: string
          mtime:
            description: Last-modified time as the container reported it.
            type: string
          link_target:
            description: Where the link points. Present only for a symlink.
            type: string
        required:
        - kind
        - size
        - mode
        - mtime
    TaskInput:
      description: A task's per-workflow `input`. It carries no discriminant of its own — the sibling `workflow` field selects the shape.
      anyOf:
      - $ref: '#/components/schemas/SearchInput'
      - $ref: '#/components/schemas/CurateInput'
      - $ref: '#/components/schemas/ImportInput'
      - $ref: '#/components/schemas/PackInput'
      - $ref: '#/components/schemas/RestoreInput'
      - $ref: '#/components/schemas/ExploreInput'
      - $ref: '#/components/schemas/ProfileInput'
      - $ref: '#/components/schemas/OptimizeInput'
      - $ref: '#/components/schemas/GroomInput'
    TaskList:
      description: One page of task records.
      type: object
      properties:
        items:
          description: The tasks on this page.
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        total:
          description: Tasks matching the filter, across every page.
          type: integer
          format: int64
        limit:
          description: Maximum tasks per page.
          type: integer
          format: int64
        offset:
          description: Where this page starts.
          type: integer
          format: int64
        page:
          description: 1-based index of this page.
          type: integer
          format: int64
        pages:
          description: Total pages available.
          type: integer
          format: int64
      required:
      - items
      - total
      - limit
      - offset
      - page
      - pages
    TaskOutput:
      nullable: true
      description: A task's reported `output`. Every workflow reports a different per-state shape, matched to a named variant only when its key set is exactly that variant's; anything else is preserved as stored. Treat this union as open. Null until the run reports anything.
      anyOf:
      - $ref: '#/components/schemas/SearchTurnCompletedOutput'
      - $ref: '#/components/schemas/SearchCcTurnCompletedOutput'
      - $ref: '#/components/schemas/SearchTurnFailedOutput'
      - $ref: '#/components/schemas/PackRunningOutput'
      - $ref: '#/components/schemas/PackCompletedOutput'
      - $ref: '#/components/schemas/RestoreRunningOutput'
      - $ref: '#/components/schemas/RestoreCompletedOutput'
      - $ref: '#/components/schemas/OptimizeResultOutput'
      - $ref: '#/components/schemas/OptimizeNoopOutput'
      - $ref: '#/components/schemas/GroomMetricsOutput'
      - $ref: '#/components/schemas/CurateRunOutput'
      - $ref: '#/components/schemas/CurateManifestTuneOutput'
      - $ref: '#/components/schemas/CurateNoopOutput'
      - $ref: '#/components/schemas/ExploreOutput'
      - $ref: '#/components/schemas/ProfileEstimateOutput'
      - $ref: '#/components/schemas/ProfileEmptyOutput'
      - $ref: '#/components/schemas/ImportOutput'
      - $ref: '#/components/schemas/StatusErrorOutput'
      - $ref: '#/components/schemas/StateFailedOutput'
      - $ref: '#/components/schemas/ErrorOutput'
      - title: Other
        description: Any shape without a named variant
        type: object
        additionalProperties: true
    TaskProgress:
      description: Coarse run progress, written by the runtime. Absent on a task that reports none.
      type: object
      properties:
        phase:
          description: 1-based index of the phase now running.
          type: integer
          format: int64
        phases:
          description: Total phases this run expects.
          type: integer
          format: int64
        label:
          description: What the current phase is doing.
          type: string
        pct:
          description: Completion across the whole run, 0–100.
          type: number
          format: double
        eta_seconds:
          nullable: true
          description: Estimated seconds remaining. Null when the run cannot estimate one.
          type: integer
          format: int64
      required:
      - phase
      - phases
      - label
      - pct
    TaskResponse:
      description: One task record — a single run of a workflow, owned by the project.
      type: object
      properties:
        id:
          description: Task id.
          type: string
        project_id:
          description: The Pinecone project that owns the task.
          type: string
        context_id:
          nullable: true
          description: The context the run acts on. Null for a task that belongs to no context.
          type: string
        agent_id:
          nullable: true
          description: Reserved. Null on every task this version serves.
          type: string
        session_id:
          nullable: true
          description: Set for query turns
          type: string
        created_by:
          description: Principal that started the run.
          type: string
        workflow:
          $ref: '#/components/schemas/Workflow'
        state:
          $ref: '#/components/schemas/TaskState'
        error:
          nullable: true
          description: Failure detail. Set on a `failed` task.
          type: string
        input:
          $ref: '#/components/schemas/TaskInput'
        output:
          $ref: '#/components/schemas/TaskOutput'
        steps:
          description: Populated only on GET /tasks/{id}. May be a trailing window when `steps_limit` was given, so read the count from `steps_total` rather than this array's length.
          type: array
          items:
            $ref: '#/components/schemas/TaskStep'
        steps_total:
          description: True number of recorded steps. Absent on a read that carries no steps.
          type: integer
          format: int64
        tokens_prompt:
          description: Input tokens the run has billed so far.
          type: integer
          format: int64
        tokens_completion:
          description: Output tokens the run has billed so far.
          type: integer
          format: int64
        runtime_seconds:
          description: Seconds the container has been running.
          type: integer
          format: int64
        running_from:
          nullable: true
          description: When the container started. Null before it does.
          type: string
          format: date-time
        timeout_seconds:
          nullable: true
          description: Runtime budget for this task. Null when it runs uncapped.
          type: integer
        timeout_at:
          nullable: true
          description: When the budget expires and the run is terminated.
          type: string
          format: date-time
        archived_at:
          nullable: true
          description: When the task's files were archived. Null while they are still live.
          type: string
          format: date-time
        created_at:
          description: When the task row was created.
          type: string
          format: date-time
        last_activity_at:
          nullable: true
          description: When the runtime last reported anything. Drives stall detection.
          type: string
          format: date-time
        schedule:
          nullable: true
          description: Cron expression this run was scheduled from. Null for an on-demand run.
          type: string
        scheduled_at:
          nullable: true
          description: When a `scheduled` task is due to start.
          type: string
          format: date-time
        parent_task_id:
          nullable: true
          description: The task that spawned this one, as an optimize spawns its curates.
          type: string
        progress:
          $ref: '#/components/schemas/TaskProgress'
      required:
      - id
      - project_id
      - created_by
      - workflow
      - state
      - input
      - steps
      - tokens_prompt
      - tokens_completion
      - runtime_seconds
      - created_at
    TaskState:
      description: Where the run has got to. `scheduled` waits for its due time; `starting` and `provisioning` are a container being claimed and built; `running` is the work happening; `stopping` is a termination in progress. `completed`, `cancelled` and `failed` are terminal.
      x-enum:
      - scheduled
      - starting
      - provisioning
      - running
      - stopping
      - completed
      - cancelled
      - failed
      type: string
    TaskStep:
      description: One reported step row. `step_id` and `status` are always set; the rest are per-workflow optionals, so an absent key stays absent.
      type: object
      properties:
        step_id:
          description: Identifies the step within the task.
          type: string
        status:
          description: How the step ended, e.g. `running` or `completed`.
          type: string
        type:
          description: What kind of step this is; the vocabulary is per-workflow.
          type: string
        content:
          description: The step's reported text payload.
          type: string
        commentary:
          description: The runtime's one-line account of what the step is doing.
          type: string
        code:
          description: Redacted tool input (search)
          type: string
        result:
          description: Redacted tool output (search)
          type: string
        cum_input_tokens:
          description: Task-to-date input tokens, including this step.
          type: integer
          format: int64
        cum_output_tokens:
          description: Task-to-date output tokens, including this step.
          type: integer
          format: int64
        job_id:
          description: Identifier of the LlamaParse job doing the work.
          type: string
        path:
          description: Source path being parsed
          type: string
      required:
      - step_id
      - status
    TemplateMatch:
      description: One manifest template an explore run proposes for the corpus.
      type: object
      properties:
        template_id:
          description: Catalog entry the run proposes for this corpus.
          type: string
        rationale:
          description: Why the run thinks this template fits the corpus.
          type: string
        confidence:
          description: How sure the run is, 0–1. Low-confidence proposals are dropped before this point.
          type: number
          format: double
      required:
      - template_id
      - rationale
      - confidence
    Trace:
      description: A turn's full-fidelity debug trace. Every turn lands one.
      type: object
      properties:
        steps:
          description: The turn's reasoning steps, in the order they ran.
          type: array
          items:
            $ref: '#/components/schemas/TraceStep'
        rollup:
          nullable: true
          description: Null on a turn the runtime never closed. The trace's copy omits the `type` and `query_id` the event form carries.
          type: object
          allOf:
          - title: Response turn rollup
            description: A turn's end-of-turn counters. Served both as the stored `response.turn_rollup` event, which adds `type` and `query_id`, and as the trace blob's copy, which does not.
            x-component-name: TurnRollup
            type: object
            properties:
              type:
                description: Event form only.
                x-enum:
                - response.turn_rollup
                type: string
              query_id:
                description: Event form only.
                type: string
              n_steps:
                description: Reasoning steps the turn ran.
                type: integer
                format: int64
              n_tool_calls:
                description: How many calls the whole turn made.
                type: integer
                format: int64
              by_category:
                description: Tool calls tallied by category.
                type: object
                additionalProperties:
                  description: Calls made in that category.
                  type: integer
                  format: int64
              total_hits:
                description: Retrieved items across all calls, before dedup.
                type: integer
                format: int64
              duration_ms:
                description: Wall time for the whole turn.
                type: integer
                format: int64
              cache_read_tokens:
                description: Input tokens served from the prompt cache.
                type: integer
                format: int64
              cache_write_tokens:
                description: Input tokens written into the prompt cache.
                type: integer
                format: int64
    TraceCall:
      description: One tool call within a step.
      type: object
      properties:
        fn:
          description: Name of the function this call invoked.
          type: string
        category:
          description: Which family the tool belongs to, as tallied in the rollup's `by_category`.
          type: string
        args:
          description: Compact, redacted summary of the call's arguments. The key set is tool-specific and deliberately open.
          type: object
          additionalProperties: true
        result:
          description: Compact summary of the call's result (never the payload). The shape varies by category and is runtime-extensible.
        duration_ms:
          description: Wall time for this one call.
          type: integer
          format: int64
        ok:
          description: Whether the call succeeded.
          type: boolean
        score_space:
          description: Which scoring space the returned scores live in, for calls that retrieve.
          type: string
        error:
          description: Failure detail. Set when `ok` is false.
          type: string
    TraceStep:
      description: One reasoning step as recorded in the trace — its generated code, tool calls, strategy, and cost. Every field is optional; a step carries what its stage produced.
      type: object
      properties:
        step_id:
          description: Identifies the step within the turn.
          type: string
        commentary:
          description: The model's own one-line account of what this step is doing.
          type: string
        code:
          $ref: '#/components/schemas/StepCode'
        calls:
          description: The tool calls this step made.
          type: array
          items:
            $ref: '#/components/schemas/TraceCall'
        strategy:
          $ref: '#/components/schemas/StepStrategy'
        cost:
          $ref: '#/components/schemas/StepCost'
    TurnRollup:
      title: Response turn rollup
      description: A turn's end-of-turn counters. Served both as the stored `response.turn_rollup` event, which adds `type` and `query_id`, and as the trace blob's copy, which does not.
      type: object
      properties:
        type:
          description: Event form only.
          x-enum:
          - response.turn_rollup
          type: string
        query_id:
          description: Event form only.
          type: string
        n_steps:
          description: Reasoning steps the turn ran.
          type: integer
          format: int64
        n_tool_calls:
          description: How many calls the whole turn made.
          type: integer
          format: int64
        by_category:
          description: Tool calls tallied by category.
          type: object
          additionalProperties:
            description: Calls made in that category.
            type: integer
            format: int64
        total_hits:
          description: Retrieved items across all calls, before dedup.
          type: integer
          format: int64
        duration_ms:
          description: Wall time for the whole turn.
          type: integer
          format: int64
        cache_read_tokens:
          description: Input tokens served from the prompt cache.
          type: integer
          format: int64
        cache_write_tokens:
          description: Input tokens written into the prompt cache.
          type: integer
          format: int64
    UpdateContextConnectorRequest:
      description: The new enabled state.
      type: object
      properties:
        enabled:
          description: Whether this context may import from the connector.
          type: boolean
      required:
      - enabled
    UpdateContextRequest:
      description: All fields optional. Empty string for description/guide clears it; `{}` for manifest clears it back to defaults. Absent leaves untouched. `kind` is immutable and cannot be updated.
      type: object
      properties:
        slug:
          description: Renames the context. Must stay unique within the project.
          type: string
        name:
          description: New display name.
          type: string
        description:
          description: New summary. Empty string clears it.
          type: string
        guide:
          description: New standing instructions. Empty string clears them.
          type: string
        manifest:
          $ref: '#/components/schemas/Manifest'
    UploadContextSourceRequest:
      description: The file to stage. One per request.
      type: object
      properties:
        file:
          description: File bytes. Archives are expanded by the import runtime.
          type: string
          format: binary
      required:
      - file
    Workflow:
      description: The canonical workflow name.
      x-enum:
      - optimize
      - curate
      - search
      - search_cc
      - search_rag
      - work
      - explore
      - profile
      - import
      - pack
      - restore
      - groom
      type: string
    WorkflowTriggerResponse:
      description: 'What every context-workflow trigger returns. The work is asynchronous: poll `GET /tasks/{task_id}`. The per-workflow booleans duplicate `state` and appear only where a workflow''s contract names one.'
      type: object
      properties:
        task_id:
          description: The enqueued task. Poll it at `GET /tasks/{id}`.
          type: string
        state:
          description: The forward-looking status the trigger put the context into.
          x-enum:
          - optimizing
          - grooming
          - exploring
          - profiling
          - importing
          type: string
        exploring:
          description: Duplicates `state`; present only for explore
          type: boolean
        profiling:
          description: Duplicates `state`; present only for profile
          type: boolean
        importing:
          description: Duplicates `state`; present only for the import/curate triggers
          type: boolean
      required:
      - task_id
      - state
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Session token from `POST /auth/login`, sent as `Authorization: Bearer <token>`.'
    apiKey:
      type: apiKey
      in: header
      name: Api-Key
      description: Pinecone API key, accepted as an alternative to the bearer token.
security:
- bearerAuth: []
- apiKey: []
tags:
- name: Auth
  description: Login and identity.
- name: Project
  description: The active Pinecone project and its disclosure state.
- name: Contexts
  description: A context is sources + a manifest. Curate it explicitly before querying.
- name: Manifest
  description: Manifest templates and the per-context manifest.
- name: Source Files
  description: Per-context source imports (upload, connector, public repo) and the source file tree.
- name: Knowledge
  description: Read-only browse of curated knowledge (chunks + artifacts).
- name: Curation
  description: Curate workflow trigger, curation ledger, and version-pin primitives.
- name: Connectors
  description: Project-level links to external source providers (Box, ...). Linked via OAuth or an API key, then used to import source documents into a context.
- name: Query
  description: 'The unified KnowQL Query API: run a query turn (`/query`), fetch a turn (`/queries/{id}`), inspect its trace, manage feedback, comparison flags, and multi-turn sessions (`/sessions`).'
- name: Tasks
  description: Top-level, project-owned task records for every workflow (optimize, curate, search, work, explore, profile, import, pack, restore, groom).
- name: Task Files
  description: Read, list, and delete files from live or archived task containers.
