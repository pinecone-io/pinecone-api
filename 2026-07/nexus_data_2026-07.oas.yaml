  /query:
    post:
      tags:
      - Query
      summary: Run one KnowQL query turn
      description: |
        Send `ask` and, on a new session, a `scope` of 1–10 contexts; continue an existing one with
        `session_id` or `previous_query_id`. Scoped search contexts must be curated, and a scope may
        not mix work and search contexts. Read the answer from `output[].content[].text`.

        `stream` and `background` are mutually exclusive. `background: true` returns `202` with an
        `in_progress` query to poll. `stream: true` emits an SSE stream whose `event:` names are the
        event `type` (see `QueryEvent`), closed by a final `query` frame carrying the whole turn:

        ```
        id: 1
        event: response.created
        data: {"type":"response.created","query_id":"qry_8b3d5f1a","session_id":"ses_4f9c1e2a"}

        id: 2
        event: response.output_text.delta
        data: {"type":"response.output_text.delta","query_id":"qry_8b3d5f1a","delta":"Revenue grew 12%..."}

        id: 3
        event: response.completed
        data: {"type":"response.completed","query_id":"qry_8b3d5f1a"}

        event: query
        data: {"id":"qry_8b3d5f1a","object":"query","status":"completed","output":[...]}
        ```
      operationId: query
      parameters:
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          description: The completed query turn (synchronous), or the SSE stream when `stream=true`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Query'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/QueryStream'
        '202':
          description: Accepted (background); poll GET /queries/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Query'
        '400':
          description: Missing/invalid `ask`, mixed-kind scope, unavailable model, or stream+background together
        '404':
          description: Scoped context, session, or previous_query_id not found
        '409':
          description: A scoped context is not curated, a query is already in flight on the session, or a preview cap was hit
        '504':
          description: Turn timed out (15-minute cap, or a lower `timeout_seconds`)
  /queries/{id}:
    get:
      tags:
      - Query
      summary: Fetch one query (turn)
      description: One turn, including its steps, citations, and usage. This is what a background run is polled with.
      operationId: get_query
