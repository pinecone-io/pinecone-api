          items:
            $ref: '#/components/schemas/ImportManifestEntry'
        manifest_sample:
          description: Bounded sample of the records that produced output
          type: array
          items:
            $ref: '#/components/schemas/ImportManifestEntry'
        manifest_truncated:
          description: Whether either sample was cut
          type: boolean
        manifest_file:
          description: Where the full manifest was written
          type: string
        manifest_object:
          description: Object-store key of the full manifest
          type: string
      required:
      - status
      - imported_items
      - output_files
      - failed
      - skipped
      - skipped_items
      - manifest_sample
      - manifest_truncated
      - manifest_file
    LiveFileListing:
      title: Live
      description: Read from the running container, so entries carry a POSIX `mode` and may be symlinks — neither of which the archived branch has. Pages by bytes as well as count, so it can stop short of `limit`.
      type: object
      properties:
        entries:
          description: The directory's immediate children.
          type: array
          items:
            description: One entry as the container reported it.
            type: object
            properties:
              name:
                description: Entry name, not a full path.
                type: string
              kind:
                description: 'Entry kind: `file`, `dir` or `symlink` when the stat is recognized, and the raw stat word otherwise.'
                type: string
              size:
                description: Byte size. 0 for a directory.
                type: integer
                format: int64
              mode:
                description: POSIX permission bits, as reported by the container.
                type: string
              mtime:
                description: Last-modified time as the container reported it.
                type: string
            required:
            - name
            - kind
            - size
            - mode
            - mtime
        total:
          description: Entries in the directory.
          type: integer
          format: int64
        offset:
          description: Where this page starts.
          type: integer
          format: int64
        limit:
          description: Maximum entries the page was allowed.
          type: integer
          format: int64
        next_offset:
          nullable: true
          description: Where the next page starts. Absent until the container is running; null once it is and the page is the last.
          type: integer
          format: int64
      required:
      - entries
      - total
      - offset
      - limit
    LoginRequest:
