        updated_at:
          description: When the project last changed.
          type: string
          format: date-time
      required:
      - id
      - name
      - created_at
      - updated_at
    ProjectTaskStats:
      description: Aggregate task counters for the whole project.
      type: object
      properties:
        tasks_total:
          description: Tasks the project has ever run.
          type: integer
        tasks_active:
          description: Tasks in a non-terminal state.
