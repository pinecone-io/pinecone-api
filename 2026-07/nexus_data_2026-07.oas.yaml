          format: int64
        by_model:
          description: Chat-seam counts keyed by the model the proxy actually dispatched to.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ModelUsage'
        embed_by_model:
          description: Embed and rerank counts keyed by model. These bill separately from the chat totals above and are not included in them.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SeamUsage'
      required:
      - prompt_tokens
