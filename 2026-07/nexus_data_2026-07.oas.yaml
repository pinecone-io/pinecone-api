    DirListing:
      description: One page of a source or knowledge directory. A listing returns a single page, so `offset` is 0 and `next_offset` is null; `limit` echoes the request rather than being applied.
      type: object
      properties:
        entries:
          description: The directory's immediate children.
          type: array
          items:
            description: One file or directory.
            type: object
            properties:
              name:
                description: Entry name, not a full path.
                type: string
              kind:
                description: Whether the entry is a file or a directory.
                x-enum:
                - dir
                - file
                type: string
              size:
                description: Byte size. 0 for a directory.
                type: integer
                format: int64
              mtime:
                description: RFC3339 last-modified, or empty when the store reports none
                type: string
            required:
            - name
            - kind
            - size
            - mtime
        total:
          description: Entries in this directory.
          type: integer
          format: int64
        offset:
          description: Echoes the request.
          type: integer
          format: int64
        limit:
          description: Echoes the request.
          type: integer
          format: int64
        next_offset:
          nullable: true
          description: Always null — a listing returns one page.
          type: integer
          format: int64
      required:
      - entries
      - total
      - offset
      - limit
    EdgeType:
      description: One typed, directed relationship between artifact types. `name`, `from`, and `to` are required of a written manifest; a read echoes a stored document that lacks one rather than failing.
      type: object
      properties:
        name:
          description: What the relationship is called, e.g. `mentions`.
          type: string
          maxLength: 64
        from:
          description: Source artifact-type name. May equal `to` for a self-referential edge.
          type: string
          maxLength: 64
        to:
          description: Target artifact-type name
          type: string
          maxLength: 64
        description:
          description: What the relationship means. Steers the extraction that finds it.
          type: string
          maxLength: 512
        attributes:
          description: Extra properties recorded on each edge, e.g. `count`.
          type: array
          items:
            description: One attribute name.
            type: string
            maxLength: 64
          maxItems: 16
      required:
      - name
      - from
      - to
    Error:
