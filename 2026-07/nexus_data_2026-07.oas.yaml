openapi: 3.0.3
info:
  title: Nexus API
  description: |
    Nexus turns a set of sources into a queryable, self-improving knowledge base. A context is **sources + a manifest**: upload sources, **curate** them into a searchable index, then query it. The manifest, one validated JSON document, defines how the context indexes, retrieves and answers.

    Curate is explicit — nothing is queryable until you run it. `{slug}` accepts a context's slug or its UUID. Query with `POST /api/query`, one turn per call, and read the answer from `output[].content[].text`; multi-turn conversations are sessions. Tasks are project-owned at `/api/tasks`, not nested under contexts.
  contact:
    name: Pinecone Support
    url: https://support.pinecone.io
    email: support@pinecone.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2026-07
servers:
- url: https://{host}/api
  description: Your Nexus deployment host
  variables:
    host:
      default: api.example.com
      description: Host of your Nexus deployment.
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Exchange a Pinecone API key for a session token
      description: Exchange a Pinecone API key for the session token every other endpoint expects. Send the token as a bearer credential.
      operationId: login
      parameters:
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Session token + identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Missing or invalid credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Not permitted. Coded cases: `preview_not_enabled` (project not enabled for the Nexus preview), `workspace_host_required` (reached over the account host on a workspace-enabled cluster).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No workspace exists at this host (`workspace_not_found`), on a workspace-enabled cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth:
    get:
      tags:
      - Auth
      summary: Current identity (whoami)
      description: Who the current credential authenticates, and which project and workspace it is scoped to.
      operationId: get_identity
      parameters:
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: The caller's identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          description: Missing or invalid credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /project:
    get:
      tags:
      - Project
      summary: Get the active project
      description: The project the session is scoped to, plus whether this deployment requires a workspace host.
      operationId: get_project
      parameters:
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: The project, plus whether this deployment requires a workspace host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectWithWorkspaces'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /connectors:
    get:
      tags:
      - Connectors
      summary: List the project's linked connectors
      description: The project's linked source providers. Filter by `kind` to those valid for a context kind.
      operationId: list_connectors
      parameters:
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      - in: query
        name: kind
        description: Filter to providers valid for this context kind.
        schema:
          description: How the context is built. `search` — built from source documents, and must be curated before it can be queried. `work` — built from traces of work done, queryable immediately, consolidated by `groom` rather than `curate`.
          default: search
          x-enum:
          - search
          - work
          type: string
        style: form
      responses:
        '200':
          description: Linked connectors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorList'
  /connectors/{id}:
    get:
      tags:
      - Connectors
      summary: Get a connector
      description: One linked connector, secrets stripped.
      operationId: get_connector
      parameters:
      - in: path
        name: id
        description: Connector id.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: The connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorView'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Connectors
      summary: Unlink a connector
      description: Unlink the connector from the project. Sources it already imported stay in place.
      operationId: delete_connector
      parameters:
      - in: path
        name: id
        description: Connector id.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedConnector'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /connectors/oauth/{provider}/start:
    get:
      tags:
      - Connectors
      summary: Start the OAuth link flow for a provider
      description: Returns an `authorize_url` for the user to open in a browser. The connector is persisted by the provider's OAuth redirect callback once the user approves access.
      operationId: start_connector_oauth
      parameters:
      - in: path
        name: provider
        description: Provider id (e.g. box)
        required: true
        schema:
          type: string
        style: simple
      - in: query
        name: return_to
        description: Console path to bounce back to after the callback
        schema:
          type: string
        style: form
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorOauthStart'
        '400':
          description: Unknown provider, or the provider is key-based
  /connectors/keys/{provider}:
    post:
      tags:
      - Connectors
      summary: Link a connector with an API key
      description: Link a key-based provider by supplying its API key directly, instead of running the OAuth flow.
      operationId: create_connector
      parameters:
      - in: path
        name: provider
        description: A key-based provider (e.g. parallel)
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectorRequest'
        required: true
      responses:
        '200':
          description: The linked connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorView'
        '400':
          description: Unknown provider, provider uses OAuth, or empty api_key
  /connectors/{id}/items:
    get:
      tags:
      - Connectors
      summary: Browse a connector's folders/files
      description: Browse the provider's folders and files to find the ids to import. Omit `folder` for the root.
      operationId: list_connector_items
      parameters:
      - in: path
        name: id
        description: Connector id.
        required: true
        schema:
          type: string
        style: simple
      - in: query
        name: folder
        description: Folder id to browse (root when absent)
        schema:
          type: string
        style: form
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: The folder browsed plus its children
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorItemList'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /contexts/{slug}/connectors:
    get:
      tags:
      - Connectors
      summary: List a context's connectors (with per-context enabled flag)
      description: The project's connectors, each with whether this context may import from it.
      operationId: list_context_connectors
      parameters:
      - in: path
        name: slug
        description: Context slug or UUID.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: Context connectors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextConnectorList'
        '404':
          description: Context not found
  /contexts/{slug}/connectors/{connector_id}:
    put:
      tags:
      - Connectors
      summary: Enable or disable a connector for a context
      description: Enable or disable one connector for this context.
      operationId: update_context_connector
      parameters:
      - in: path
        name: slug
        description: Context slug or UUID.
        required: true
        schema:
          type: string
        style: simple
      - in: path
        name: connector_id
        description: Connector id.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContextConnectorRequest'
        required: true
      responses:
        '200':
          description: The updated context connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextConnectorView'
        '400':
          description: Provider does not support this context kind
        '404':
          description: Context or connector not found
  /contexts:
    get:
      tags:
      - Contexts
      summary: List contexts (newest first, with stats)
      description: Every context in the active project, newest first, each with its aggregate task counters.
      operationId: list_contexts
      parameters:
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: Contexts visible to the caller in the active project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextList'
    post:
      tags:
      - Contexts
      summary: Create a context
      description: 'Created empty, and not queryable until you import sources and curate them — curate is explicit. Optionally seed a `manifest`. A `work` context is the exception: queryable from day zero, built from traces of work rather than documents.'
      operationId: create_context
      parameters:
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContextRequest'
        required: true
      responses:
        '200':
          description: The created context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Project not enabled for the Nexus preview (`preview_not_enabled`), or a per-plan context cap blocks creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug already exists
  /contexts/{slug}:
    get:
      tags:
      - Contexts
      summary: Get a context
      description: One context and its derived lifecycle flags.
      operationId: get_context
      parameters:
      - in: path
        name: slug
        description: Context slug or UUID.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: The context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Contexts
      summary: Update a context
      description: All fields optional; an absent one is left untouched. An empty string clears `description`/`guide`, and `{}` clears the manifest back to defaults.
      operationId: update_context
      parameters:
      - in: path
        name: slug
        description: Context slug or UUID.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContextRequest'
        required: true
      responses:
        '200':
          description: The updated context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug conflict
    delete:
      tags:
      - Contexts
      summary: Delete a context (and its Pinecone indexes)
      description: Delete the context, its sources, its curated knowledge, and its Pinecone indexes. Not reversible.
      operationId: delete_context
      parameters:
      - in: path
        name: slug
        description: Context slug or UUID.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: Deleted (empty body)
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Active tasks did not terminate in time
  /contexts/{slug}/manifest:
    get:
      tags:
      - Manifest
      summary: Get the context's manifest
      description: The context's pinned manifest document. A context that pins nothing returns `null` — the runtime fills defaults. Writes go through the `manifest` field on `PUT /contexts/{slug}`.
      operationId: get_context_manifest
      parameters:
      - in: path
        name: slug
        description: Context slug or UUID.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: The manifest document, or `null` when the context pins none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullableManifest'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /contexts/{slug}/tasks/stats:
    get:
      tags:
      - Contexts
      summary: Per-context task statistics
      description: Aggregate counters over every task this context has run. The project-wide equivalent is `GET /stats`.
      operationId: get_context_task_stats
      parameters:
      - in: path
        name: slug
        description: Context slug or UUID.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: Aggregate task counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextStats'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /contexts/{slug}/curate:
    get:
      tags:
      - Curation
      summary: Get the curation ledger
      description: 'What the last curate recorded: the per-source hash and timestamp map, artifact edges, corpus groups, the live version pin, delete tombstones, artifact-reclaim intents, and the pointer and glossary resume cursors. Chunk ids are tracked too but not served — an internal retrieval unit.'
      operationId: get_curation_ledger
      parameters:
      - in: path
        name: slug
        description: Context slug or UUID.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: Curation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationState'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Curation
      summary: Build or rebuild the context's index from its sources
      description: 'Curate the staged sources under the active manifest. **Required before querying** — there is no auto-curate. Body is optional; `force: true` rebuilds fully, which is what a manifest edit needs. Search contexts only: a work context builds via `work`/`groom`.'
      operationId: curate_context
      parameters:
      - in: path
        name: slug
        description: Context slug or UUID.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurateContextRequest'
      responses:
        '200':
          description: 'Curate enqueued (`state: importing`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerResponse'
        '400':
          description: Context is a work context
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Context has no sources, is optimizing, or hit the preview task cap
  /contexts/{slug}/curate/delete-sources:
    post:
      tags:
      - Curation
      summary: Drop named sources from the index + ledger
      description: Drop named sources from the index and the curation ledger without re-reading the rest of the corpus.
      operationId: delete_curated_sources
      parameters:
      - in: path
        name: slug
        description: Context slug or UUID.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCuratedSourcesRequest'
        required: true
      responses:
        '200':
          description: Done (empty body)
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /contexts/{slug}/optimize:
    post:
      tags:
      - Contexts
      summary: Trigger an on-demand self-tuning optimize
