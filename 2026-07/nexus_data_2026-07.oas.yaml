          - $ref: '#/components/schemas/Manifest'
        trigger:
          description: What started the run, e.g. `manual`.
          type: string
      required:
      - manifest
      - trigger
    ProfileTierCost:
      description: What the curate would cost at one model tier.
      type: object
      properties:
        tokens:
          description: The `point` estimate sits at G's midpoint and splits into input/output; `lo`/`hi` are band totals.
          type: object
          properties:
            point:
              description: Estimate at the artifact count's midpoint.
              type: integer
              format: int64
            lo:
              description: Total at the low end of the band.
              type: integer
              format: int64
            hi:
              description: Total at the high end of the band.
              type: integer
              format: int64
            input:
              description: Input share of the point estimate.
              type: integer
              format: int64
            output:
              description: Output share of the point estimate.
              type: integer
              format: int64
          required:
          - point
          - lo
          - hi
          - input
          - output
        time_s:
          description: Estimated wall-clock band for the curate, in seconds.
          type: object
          properties:
            lo:
              description: Low end of the wall-clock band.
              type: integer
              format: int64
            hi:
              description: High end of the wall-clock band.
              type: integer
              format: int64
          required:
          - lo
          - hi
      required:
      - tokens
      - time_s
    Project:
      description: The Pinecone project every context, session, and task in this deployment belongs to.
