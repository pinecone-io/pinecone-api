                default: 60000
                type: integer
                minimum: 0
                maximum: 600000
              min_group_size:
                description: How many near-duplicate problem queries must cluster together before the loop tunes for them. Keeps a one-off slow query from triggering a manifest change.
                default: 2
                type: integer
                minimum: 1
                maximum: 100
              eval_pass_rate_threshold:
                description: Fraction of eval queries a candidate manifest must answer correctly to be considered ready. `1` demands all of them.
