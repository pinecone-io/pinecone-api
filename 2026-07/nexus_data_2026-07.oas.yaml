  /queries/{id}/events:
    get:
      tags:
      - Query
      summary: Stream a query turn's events (SSE)
      description: 'The turn''s events as they land — the same `type`-named events `POST /query` emits with `stream: true`, as a standalone resumable subscription. Reconnect with `Last-Event-ID` to replay from where the stream dropped.'
      operationId: stream_query_events
      parameters:
      - in: path
        name: id
        description: Query turn id.
        required: true
        schema:
          type: string
        style: simple
      - in: header
        name: Last-Event-ID
        description: Resume from this event seq; delivery is inclusive of the given id (re-sending the last event is harmless — clients merge steps idempotently by step_id).
        schema:
          type: string
        style: simple
      - in: header
        name: X-Pinecone-Api-Version
        description: Date-based contract version, echoed back on the same header. Omit for the default (`2026-07`); send `unstable` for the in-development surface. An unrecognized value is rejected with `400 unsupported_api_version`.
        schema:
          default: 2026-07
          x-enum:
          - 2026-07
          - unstable
          type: string
        style: simple
      responses:
        '200':
          description: SSE event stream; each `event:` name is the event `type` and `data:` is its JSON payload.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/QueryStream'
        '404':
          description: Query not found
