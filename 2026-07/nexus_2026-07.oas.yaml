components:
  schemas:
    Error:
      type: object
      required:
      - message
      description: The error envelope every non-2xx response uses.
      properties:
        message:
          type: string
        code:
          type: string
          description: 'Stable machine-readable code, present only on errors a client must branch on. '
          x-enum:
          - unsupported_api_version
          - preview_not_enabled
          - preview_file_limit
          - preview_byte_limit
          - workspace_host_required
          - workspace_not_found
    Project:
      type: object
      required:
      - id
      - name
      - created_at
      - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectWithWorkspaces:
      allOf:
      - $ref: '#/components/schemas/Project'
      - type: object
        required:
        - workspaces_required
        properties:
          workspaces_required:
            type: boolean
            description: True on a workspace-enabled cluster, where requests must use the `wksp.*` workspace
              host rather than the account host.
    ContextKind:
      type: string
      x-enum:
      - search
      - work
      default: search
      description: '`search` — built from source documents; must be curated before it can be queried.
        `work` — built from traces of work done; queryable immediately and consolidated by `groom` rather
        than `curate`.'
    Workflow:
      type: string
      x-enum:
      - optimize
      - curate
      - search
      - search_cc
      - search_rag
      - work
      - explore
      - profile
      - import
      - pack
      - restore
      - groom
      description: The canonical workflow name. Legacy aliases (`build`, `query`, `query_search`, `query_sac`,
        `query_cc`, `query_rag`, `response`, `agent`, `session`) are still accepted on input and normalized
        to the canonical value.
    TaskState:
      type: string
      x-enum:
      - scheduled
      - starting
      - provisioning
      - running
      - stopping
      - completed
      - cancelled
      - failed
    ContextStats:
      type: object
      required:
      - tasks_total
      - tasks_active
      - tasks_completed
      - tasks_failed
      - tasks_cancelled
      - tokens_total
      - runtime_seconds
      properties:
        tasks_total:
          type: integer
          format: int64
        tasks_active:
          type: integer
          format: int64
        tasks_completed:
          type: integer
          format: int64
        tasks_failed:
          type: integer
          format: int64
        tasks_cancelled:
          type: integer
          format: int64
        tokens_total:
          type: integer
          format: int64
        runtime_seconds:
          type: integer
          format: int64
    TemplateMatch:
      type: object
      required:
      - template_id
      - rationale
      - confidence
      properties:
        template_id:
          type: string
        rationale:
          type: string
        confidence:
          type: number
          format: double
    ManifestSuggestion:
      type: object
      required:
      - matches
      - none
      - explored_at
      description: Outcome of a Design-flow explore run, pinned to the context row.
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/TemplateMatch'
        none:
          type: boolean
          description: True when no template fit
        explored_at:
          type: string
          format: date-time
        task_id:
          type: string
    ContextResponse:
      type: object
      description: What context endpoints return (derived flags).
      required:
      - id
      - slug
      - name
      - kind
      - created_by
      - description
      - is_optimizing
      - has_sources
      - is_curating
      - is_importing
      - is_exploring
      - is_restoring
      - is_grooming
      - created_at
      - updated_at
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ContextKind'
        workspace:
          type: string
          description: Present only on a workspace-enabled cluster
        created_by:
          type: string
        description:
          type: string
          nullable: true
        guide:
          type: string
          description: High-level guidance for the query runtime
        manifest:
          allOf:
          - $ref: '#/components/schemas/Manifest'
          description: Pinned manifest document; absent when the context is on defaults
        is_optimizing:
          type: boolean
        optimize_task_id:
          type: string
          nullable: true
        optimize_score:
          type: number
          format: double
          nullable: true
        optimize_iterations:
          type: integer
          nullable: true
        last_optimized_at:
          type: string
          format: date-time
          nullable: true
        last_curated_at:
          type: string
          format: date-time
          nullable: true
        has_sources:
          type: boolean
        last_source_import_at:
          type: string
          format: date-time
          nullable: true
        is_curating:
          type: boolean
        curate_task_id:
          type: string
          nullable: true
        is_importing:
          type: boolean
        import_task_id:
          type: string
          nullable: true
        is_exploring:
          type: boolean
        explore_task_id:
          type: string
          nullable: true
        is_restoring:
          type: boolean
        restore_task_id:
          type: string
          nullable: true
        manifest_suggestion:
          $ref: '#/components/schemas/ManifestSuggestion'
        sample_queries:
          type: array
          items:
            type: string
          description: Example questions the curated corpus can answer
        is_grooming:
          type: boolean
        groom_task_id:
          type: string
        groom_artifact_count:
          type: integer
          format: int64
        last_groomed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        stats:
          allOf:
          - $ref: '#/components/schemas/ContextStats'
          description: Populated only on the list endpoint
    CreateContextRequest:
      type: object
      required:
      - slug
      - name
      properties:
        slug:
          type: string
          description: 3–64 chars, lowercase alnum + hyphens, starts with a letter
        name:
          type: string
          description: 1–128 chars
        description:
          type: string
        guide:
          type: string
        manifest:
          allOf:
          - $ref: '#/components/schemas/Manifest'
          description: Seed manifest (validated against the manifest schema)
        kind:
          $ref: '#/components/schemas/ContextKind'
    UpdateContextRequest:
      type: object
      description: All fields optional. Empty string for description/guide clears it; `{}` for manifest
        clears it back to defaults. Absent leaves untouched. `kind` is immutable and cannot be updated.
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        guide:
          type: string
        manifest:
          $ref: '#/components/schemas/Manifest'
    WorkflowTriggerResponse:
      type: object
      required:
      - task_id
      - state
      description: The uniform acknowledgment every context-workflow trigger returns. `state` is the forward-looking
        status; the per-workflow boolean flags are legacy and set only for the workflows that historically
        emitted them.
      properties:
        task_id:
          type: string
        state:
          type: string
          x-enum:
          - optimizing
          - grooming
          - exploring
          - profiling
          - importing
        exploring:
          type: boolean
          description: Legacy flag; present only for explore
        profiling:
          type: boolean
          description: Legacy flag; present only for profile
        importing:
          type: boolean
          description: Legacy flag; present only for the import/curate triggers
    DirListing:
      type: object
      required:
      - entries
      - total
      - offset
      - limit
      description: A paginated source/knowledge directory listing.
      properties:
        entries:
          type: array
          items:
            type: object
            required:
            - name
            - kind
            - size
            - mtime
            properties:
              name:
                type: string
              kind:
                type: string
                x-enum:
                - dir
                - file
              size:
                type: integer
                format: int64
              mtime:
                type: string
                description: RFC3339 last-modified, or empty when the store reports none
        total:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        next_offset:
          type: integer
          format: int64
          nullable: true
    FileStats:
      type: object
      required:
      - file_count
      - dir_count
      - total_size
      properties:
        file_count:
          type: integer
          format: int64
        dir_count:
          type: integer
          format: int64
        total_size:
          type: integer
          format: int64
    SourceStats:
      allOf:
      - $ref: '#/components/schemas/FileStats'
      - type: object
        description: Quota fields are present only under preview mode.
        properties:
          max_files_per_context:
            type: integer
            format: int64
          max_bytes_per_context:
            type: integer
            format: int64
          used_files:
            type: integer
            format: int64
          used_bytes:
            type: integer
            format: int64
    TaskFileListing:
      type: object
      required:
      - entries
      - total
      - offset
      - limit
      description: A task's file listing. A running task's entries carry `mode`; an archived task's do
        not.
      properties:
        entries:
          type: array
          items:
            type: object
            required:
            - name
            - kind
            - size
            - mtime
            properties:
              name:
                type: string
              kind:
                type: string
                x-enum:
                - dir
                - file
              size:
                type: integer
                format: int64
              mode:
                type: string
                description: Running tasks only
              mtime:
                type: string
        total:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        next_offset:
          type: integer
          format: int64
          nullable: true
    TaskFileMetadata:
      oneOf:
      - type: object
        title: Archived
        required:
        - is_dir
        - is_file
        - size
        properties:
          is_dir:
            type: boolean
          is_file:
            type: boolean
          size:
            type: integer
            format: int64
          modified:
            type: integer
            format: int64
            nullable: true
            description: Unix seconds
      - type: object
        title: Live
        required:
        - kind
        - size
        - mode
        - mtime
        properties:
          kind:
            type: string
          size:
            type: integer
            format: int64
          mode:
            type: string
          mtime:
            type: string
          link_target:
            type: string
    Manifest:
      type: object
      description: The context manifest that drives curate and search. A sparse document — every field
        is optional and an omitted key falls back to the validator default, so absent fields are omitted
        rather than nulled. Value constraints are enforced by the write-side validator.
      properties:
        curate:
          $ref: '#/components/schemas/CurateManifest'
        optimize:
          $ref: '#/components/schemas/OptimizeManifest'
    CurateManifest:
      type: object
      properties:
        chunks:
          $ref: '#/components/schemas/ChunksConfig'
        artifacts:
          $ref: '#/components/schemas/ArtifactsConfig'
    ChunksConfig:
      type: object
      description: Source chunking + embedding config.
      properties:
        enabled:
          type: boolean
          default: true
        embedding_model:
          type: string
          maxLength: 128
          default: multilingual-e5-large
        chunking:
          $ref: '#/components/schemas/ChunkingConfig'
        keyword:
          type: object
          properties:
            enabled:
              type: boolean
              default: true
    ChunkingConfig:
      type: object
      properties:
        strategy:
          type: string
          x-enum:
          - markdown_heading
          - sliding_window
          - html
          - csv
          - code
          default: markdown_heading
        target_size:
          type: integer
          minimum: 64
          maximum: 4096
          default: 512
        overlap:
          type: integer
          minimum: 0
          maximum: 1024
          default: 64
        respect_sections:
          type: boolean
          default: true
    ArtifactsConfig:
      type: object
      description: Knowledge-artifact extraction config.
      properties:
        enabled:
          type: boolean
          default: false
        artifact_model:
          type: string
          x-enum:
          - standard
          - lite
          default: lite
        artifact_types:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ArtifactType'
        edge_types:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/EdgeType'
        min_doc_count:
          type: integer
          minimum: 1
          maximum: 64
          default: 1
        max_tokens:
          type: integer
          minimum: 128
          maximum: 8192
          default: 1500
        max_doc_chars:
          type: integer
          minimum: 1000
          maximum: 2000000
          default: 60000
        extraction_window_chars:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
        mention_max_chars:
          type: integer
          minimum: 100
          maximum: 4000
          default: 400
        max_mentions_per_artifact:
          type: integer
          minimum: 1
          maximum: 500
          default: 40
        mention_context_chars:
          type: integer
          minimum: 1000
          maximum: 100000
          default: 8000
        max_artifacts_per_type:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10000
    ArtifactType:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 64
        kind:
          type: string
          x-enum:
          - summary
          - topic
          - entity
          - event
          - doc
          - page
          - glossary
          default: topic
        scope:
          type: string
          x-enum:
          - document
          - corpus
          default: corpus
        icon:
          type: string
        description:
          type: string
        coverage:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
        sections:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 128
        min_doc_count:
          type: integer
          minimum: 1
          maximum: 64
          default: 1
        format:
          type: string
          x-enum:
          - markdown
          - sqlite
          default: markdown
        columns:
          type: array
          maxItems: 64
          description: sqlite-format artifacts only
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                maxLength: 64
              type:
                type: string
                x-enum:
                - TEXT
                - INTEGER
                - REAL
                - NUMERIC
                default: TEXT
              description:
                type: string
        natural_key:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 64
    EdgeType:
      type: object
      required:
      - name
      - from
      - to
      properties:
        name:
          type: string
          maxLength: 64
        from:
          type: string
          maxLength: 64
          description: Source artifact-type name
        to:
          type: string
          maxLength: 64
          description: Target artifact-type name
        description:
          type: string
        attributes:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 64
    OptimizeManifest:
      type: object
      description: Scheduled self-tuning config.
      properties:
        schedule:
          type: string
          maxLength: 128
          default: 0 * * * *
          description: cron
        latency_threshold_ms:
          type: integer
          minimum: 0
          maximum: 600000
          default: 60000
        min_group_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 2
        eval_pass_rate_threshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 1
        max_iterations:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    ManifestTemplateCatalog:
      type: object
      required:
      - version
      - default_id
      - templates
      properties:
        version:
          type: integer
          format: int64
        default_id:
          type: string
        templates:
          type: array
          items:
            $ref: '#/components/schemas/ManifestTemplate'
    ManifestTemplate:
      type: object
      required:
      - id
      - label
      - description
      - when_to_use
      - default
      - sample_questions
      - manifest
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        when_to_use:
          type: string
        default:
          type: boolean
          description: True on the catalog's default template
        sample_questions:
          type: array
          items:
            type: string
        manifest:
          $ref: '#/components/schemas/Manifest'
    SourceManifestEntry:
      type: object
      required:
      - hash
      - curated_at
      properties:
        hash:
          type: string
        curated_at:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
          default: 0
        mtime:
          type: string
          format: date-time
          nullable: true
    CorpusGroup:
      type: object
      required:
      - group_key
      - member_sources
      - canonical_name
      - membership_hash
      properties:
        group_key:
          type: string
        member_sources:
          type: array
          items:
            type: string
        canonical_name:
          type: string
        membership_hash:
          type: string
        added_version:
          type: integer
          format: int64
          default: 0
    PointerEntry:
      type: object
      required:
      - type
      - name
      properties:
        type:
          type: string
          description: Artifact-type name
        name:
          type: string
        mention:
          type: string
        seq:
          type: integer
    GlossaryEntry:
      type: object
      required:
      - type
      - name
      - clause
      properties:
        type:
          type: string
        name:
          type: string
        clause:
          type: string
    ArtifactReclaim:
      type: object
      required:
      - removed_id
      - added_id
      - version
      properties:
        removed_id:
          type: string
        added_id:
          type: string
        version:
          type: integer
          format: int64
    ChunkReclaim:
      type: object
      required:
      - source
      - removed_version
      - chunk_ids
      properties:
        source:
          type: string
        removed_version:
          type: integer
          format: int64
        chunk_ids:
          type: array
          items:
            type: string
    SourceRemoved:
      type: object
      required:
      - removed_version
      description: A deferred whole-source delete tombstone.
      properties:
        removed_version:
          type: integer
          format: int64
        removed_at:
          type: string
          format: date-time
          nullable: true
    CurationState:
      type: object
      required:
      - manifest
      - edges
      - corpus_groups
      - chunk_ids
      - live_version
      - versions_stamped
      - source_removed
      - redispatch_count
      - artifact_reclaim
      - chunk_reclaim
      - source_pointers
      - source_glossary
      properties:
        manifest:
          type: object
          description: Per-source curate ledger, keyed by source path.
          additionalProperties:
            $ref: '#/components/schemas/SourceManifestEntry'
        edges:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        corpus_groups:
          type: array
          items:
            $ref: '#/components/schemas/CorpusGroup'
        chunk_ids:
          type: object
          description: Chunk-id lineage, keyed by source path.
          additionalProperties:
            type: array
            items:
              type: string
        live_version:
          type: integer
          format: int64
        versions_stamped:
          type: boolean
        source_removed:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SourceRemoved'
        redispatch_count:
          type: integer
        artifact_reclaim:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactReclaim'
        chunk_reclaim:
          type: array
          items:
            $ref: '#/components/schemas/ChunkReclaim'
        source_pointers:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/PointerEntry'
        source_glossary:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/GlossaryEntry'
    PackDetails:
      type: object
      description: Publisher-facing pack enrichment.
      properties:
        description:
          type: string
        sample_queries:
          type: array
          items:
            type: string
    PackTaskOutput:
      type: object
      required:
      - state
      description: A pack task's output, discriminated by `state`. Fields are per-state; absent fields
        are omitted rather than nulled.
      properties:
        state:
          type: string
          x-enum:
          - running
          - completed
          - failed
          - unknown
        slug:
          type: string
        include_traces:
          type: boolean
        started_at:
          type: string
        completed_at:
          type: string
        enriching:
          type: boolean
        sources_total:
          type: integer
          format: int64
        knowledge_total:
          type: integer
          format: int64
        traces_total:
          type: integer
          format: int64
        files_written:
          type: integer
          format: int64
        bytes_collected:
          type: integer
          format: int64
        pack_filename:
          type: string
        pack_size:
          type: integer
          format: int64
        sources_files:
          type: integer
          format: int64
        knowledge_files:
          type: integer
          format: int64
        traces_included:
          type: boolean
        traces_files:
          type: integer
          format: int64
        corpus_groups_included:
          type: integer
          format: int64
        details:
          $ref: '#/components/schemas/PackDetails'
        error:
          type: string
    ConnectorView:
      type: object
      required:
      - id
      - provider
      - created_at
      - updated_at
      description: The connector view returned by connector endpoints (secrets stripped). There is no
        `config` field — no provider populates one today.
      properties:
        id:
          type: string
        provider:
          type: string
          description: e.g. box
        account_label:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContextConnectorView:
      allOf:
      - $ref: '#/components/schemas/ConnectorView'
      - type: object
        required:
        - enabled
        description: A project connector with its per-context enabled flag.
        properties:
          enabled:
            type: boolean
    ConnectorItem:
      type: object
      required:
      - id
      - name
      - type
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          x-enum:
          - file
          - folder
        size:
          type: integer
          format: int64
          description: Files only, when the provider reports it
    QueryRequest:
      type: object
      required:
      - ask
      description: A single KnowQL query turn. `scope` and the session-config fields (`system_prompt`,
        `guardrails`, `model`/`models`, `tools`) are honored only when starting a NEW session
        and are pinned for its life; continue an existing session with `session_id` or `previous_query_id`.
        The per-turn controls (`workflow`, `shape`, `max_steps`, `thinking_level`, `compose`, `retrieval_only`/`pointers_only`,
        `chunks_only`/`artifacts_only`, `max_retrieved`/`max_retrieved_chars`) ride the turn and are not
        pinned to the session.
      properties:
        ask:
          type: string
          description: The natural-language question
        scope:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
          description: Context slugs/UUIDs. New session only; pinned for the session's life. A scope may
            not mix work and search contexts.
        session_id:
          type: string
          description: Continue an existing session
        previous_query_id:
          type: string
          description: Continue the session this query belongs to
        workflow:
          type: string
          x-enum:
          - search
          - search_cc
          - search_rag
          description: Search workflow for this turn. Legacy aliases `query_search`/`query_sac`, `query_cc`,
            `query_rag` are still accepted on input. Ignored for work contexts, which always run the `work`
            runtime.
        system_prompt:
          type: string
          description: Instructions pinned to a new session
        guardrails:
          type: string
          description: Guardrails pinned to a new session
        shape:
          type: object
          additionalProperties: true
          description: JSON Schema subset for structured output; result in output_json
        model:
          type: string
          description: provider/model
        models:
          type: array
          items:
            type: string
          description: Ordered fallback list; takes precedence over model
        tools:
          type: array
          items:
            type: string
        stream:
          type: boolean
          description: SSE streaming. Mutually exclusive with background.
        background:
          type: boolean
          description: 'Fire-and-forget: 202 + in_progress query; poll GET /queries/{id}. Mutually exclusive
            with stream.'
        timeout_seconds:
          type: integer
          format: int64
          description: May only LOWER the 15-minute (900s) cap
        max_steps:
          type: integer
          format: int64
          description: Cap the agent's tool-loop steps for this turn
        thinking_level:
          type: string
          x-enum:
          - minimal
          - low
          - medium
          - high
          description: Gemini reasoning depth. Default `low`. Gemini-backed workflows only; ignored for
            `search_cc`.
        compose:
          type: boolean
          description: '`false` skips synthesis (alias for `retrieval_only`)'
        retrieval_only:
          type: boolean
          description: Skip synthesis; return retrieved hits in `output_json`
        pointers_only:
          type: boolean
          description: Skip synthesis; return just pointers in `output_json`
        chunks_only:
          type: boolean
          description: Retrieval-only, narrowed to chunks
        artifacts_only:
          type: boolean
          description: Retrieval-only, narrowed to artifacts
        max_retrieved:
          type: integer
          format: int64
          description: Cap the item count for retrieval-only turns
        max_retrieved_chars:
          type: integer
          format: int64
          description: Cap per-item verbatim text length for retrieval-only turns
        comparison_group:
          type: string
          description: Client-generated id shared by the turns of one Compare run, so the preview per-project
            query cap treats them as a single action. The group is size-bounded server-side (max 3 turns).
            Omit for a normal single query.
    QueryComparisonMember:
      type: object
      required:
      - workflow
      - query_id
      properties:
        workflow:
          type: string
        query_id:
          type: string
        model:
          type: string
    Citation:
      type: object
      required:
      - source
      description: A cited source in a completed turn's answer.
      properties:
        source:
          type: string
        section_paths:
          type: array
          items:
            type: array
            items:
              type: string
          description: Heading paths within the source, when known.
        pages:
          type: array
          items:
            type: integer
            format: int64
        grounding:
          type: string
        kind:
          type: string
    QueryStep:
      type: object
      required:
      - step_id
      - status
      - commentary
      properties:
        step_id:
          type: string
        status:
          type: string
        commentary:
          type: string
        fns:
          type: array
          items:
            type: string
        code:
          type: string
        cum_input_tokens:
          type: integer
          format: int64
        cum_output_tokens:
          type: integer
          format: int64
    Query:
      type: object
      required:
      - id
      - object
      - session_id
      - created
      - status
      - input
      - output
      - citations
      - steps
      - usage
      - runtime_ms
      description: One query turn. Read the answer from `output[].content[].text`.
      properties:
        id:
          type: string
        object:
          type: string
          x-enum:
          - query
        session_id:
          type: string
        model:
          type: string
          nullable: true
        created:
          type: integer
          format: int64
          description: Unix seconds
        status:
          type: string
          x-enum:
          - in_progress
          - completed
          - failed
          - cancelled
        error:
          type: string
          nullable: true
        previous_query_id:
          type: string
          nullable: true
        comparison:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/QueryComparisonMember'
        feedback:
          type: object
          nullable: true
          required:
          - rating
          properties:
            rating:
              type: string
              x-enum:
              - up
              - down
            comment:
              type: string
              nullable: true
        input:
          type: array
          description: The stored message array (plain-text `content`).
          items:
            type: object
            required:
            - role
            - content
            properties:
              role:
                type: string
              content:
                type: string
        output:
          type: array
          description: 'Output items; assistant text is `{role, content:[{type: output_text, text}]}`'
          items:
            type: object
            required:
            - role
            - content
            properties:
              role:
                type: string
              content:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - text
                  properties:
                    type:
                      type: string
                      example: output_text
                    text:
                      type: string
        output_json:
          type: object
          nullable: true
          additionalProperties: true
          description: Present when a shape was used, or on a retrieval-only turn
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/QueryStep'
        rollup:
          type: object
          nullable: true
          description: Per-turn token/cache totals + tool tally (`response.turn_rollup`)
          properties:
            type:
              type: string
              example: response.turn_rollup
            query_id:
              type: string
            cache_read_tokens:
              type: integer
              format: int64
            cache_write_tokens:
              type: integer
              format: int64
            n_steps:
              type: integer
              format: int64
            n_tool_calls:
              type: integer
              format: int64
            by_category:
              type: object
              additionalProperties:
                type: integer
                format: int64
            total_hits:
              type: integer
              format: int64
            duration_ms:
              type: integer
              format: int64
        synthesis:
          type: object
          nullable: true
          description: Token/latency of the answer completion (`response.synthesis`)
          properties:
            type:
              type: string
              example: response.synthesis
            query_id:
              type: string
            status:
              type: string
            tokens_in:
              type: integer
              format: int64
            tokens_out:
              type: integer
              format: int64
            ms:
              type: integer
              format: int64
            answer_preview:
              type: string
            tokens_in_cached:
              type: integer
              format: int64
            tokens_in_cache_write:
              type: integer
              format: int64
            tokens_in_fresh:
              type: integer
              format: int64
        trace_ref:
          type: string
          nullable: true
          description: Blob key of the persisted trace
        usage:
          type: object
          required:
          - input_tokens
          - output_tokens
          - total_tokens
          properties:
            input_tokens:
              type: integer
              format: int64
            output_tokens:
              type: integer
              format: int64
            total_tokens:
              type: integer
              format: int64
        runtime_ms:
          type: integer
          format: int64
    Session:
      type: object
      required:
      - id
      - project_id
      - created_by
      - scope
      - models
      - tools
      - created_at
      - updated_at
      description: A project-owned conversation thread of queries.
      properties:
        id:
