  /query:
    parameters:
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Query
      summary: Run one KnowQL query turn
      description: 'Send `ask` (the natural-language question) and, when starting a new session, a `scope`
        of 1–10 contexts. Continue an existing session with `session_id` or `previous_query_id`. Scoped
        search contexts must be curated (work contexts are queryable immediately), and a scope may not
        mix work and search contexts.


        `stream` and `background` are mutually exclusive. With `background: true` the API returns `202`
        with an `in_progress` query and the client polls `GET /queries/{id}`. With `stream: true` the
        API emits an SSE stream whose `event:` names are the event `type` (`response.created`, `response.step`,
        `response.output_text.delta`, `response.turn_rollup`, `response.synthesis`, `response.trace`,
        and a terminal `response.completed` / `response.failed` / `response.cancelled`), followed by a
        final `query` event carrying the full query object. Read the answer from `output[].content[].text`.'
      operationId: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: The completed query turn (synchronous), or the SSE stream when `stream=true`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Query'
            text/event-stream:
              schema:
                description: 'Server-sent event stream. While the turn runs, each progress frame has an
                  `id:` (the event''s sequence number — send it back as the `Last-Event-ID` header to
                  resume), an `event:` name equal to the QueryEvent `type` (e.g. `response.step`), and
                  that QueryEvent as its JSON `data:`. When the turn finishes, a final frame named `event:
                  query` is sent — no `id:`, with the full Query document as `data:`.

                  '
                oneOf:
                - $ref: '#/components/schemas/QueryEvent'
                - $ref: '#/components/schemas/Query'
        '202':
          description: Accepted (background); poll GET /queries/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Query'
        '400':
          description: Missing/invalid `ask`, mixed-kind scope, unavailable model, or stream+background
            together
        '404':
          description: Scoped context, session, or previous_query_id not found
        '409':
          description: A scoped context is not curated, a query is already in flight on the session, or
            a preview cap was hit
        '504':
          description: Turn timed out (15-minute cap, or a lower `timeout_seconds`)
  /queries/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Query
      summary: Fetch one query (turn)
      operationId: get_query
      responses:
        '200':
          description: The query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Query'
        '404':
          $ref: '#/components/responses/NotFound'
  /queries/{id}/cancel:
