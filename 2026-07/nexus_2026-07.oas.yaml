              type: string
            scope:
              type: array
              items:
                type: string
        cost:
          type: object
          required:
          - tokens_in
          - tokens_out
          - decide_ms
          - execute_ms
          description: The step's incremental cost (deltas against the running turn cursor).
          properties:
            tokens_in:
              type: integer
              format: int64
            tokens_out:
              type: integer
              format: int64
            decide_ms:
              type: integer
              format: int64
            execute_ms:
              type: integer
              format: int64
            tokens_in_cached:
              type: integer
              format: int64
            tokens_in_cache_write:
              type: integer
              format: int64
            tokens_in_fresh:
              type: integer
              format: int64
    TraceCall:
      type: object
