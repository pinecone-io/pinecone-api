          description: '`response.step`'
        code:
          type: string
          description: '`response.step`'
        cum_input_tokens:
          type: integer
          format: int64
          description: '`response.step`'
        cum_output_tokens:
          type: integer
          format: int64
          description: '`response.step`'
        n_steps:
          type: integer
          format: int64
          description: '`response.turn_rollup`'
        n_tool_calls:
          type: integer
          format: int64
          description: '`response.turn_rollup`'
        by_category:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: '`response.turn_rollup`'
        total_hits:
          type: integer
          format: int64
          description: '`response.turn_rollup`'
        duration_ms:
          type: integer
          format: int64
          description: '`response.turn_rollup`'
        cache_read_tokens:
          type: integer
          format: int64
          description: '`response.turn_rollup`'
        cache_write_tokens:
          type: integer
          format: int64
          description: '`response.turn_rollup`'
        tokens_in:
          type: integer
          format: int64
          description: '`response.synthesis`'
        tokens_out:
          type: integer
          format: int64
          description: '`response.synthesis`'
        ms:
          type: integer
          format: int64
          description: '`response.synthesis`'
        answer_preview:
          type: string
          description: '`response.synthesis`'
        tokens_in_cached:
          type: integer
          format: int64
          description: '`response.synthesis`'
        tokens_in_cache_write:
          type: integer
          format: int64
          description: '`response.synthesis`'
        tokens_in_fresh:
          type: integer
          format: int64
          description: '`response.synthesis`'
    Trace:
