      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Query
      summary: Fetch the recorded trace for a query turn
      description: The per-turn debug trace (steps, tool calls, strategy, cost, rollup). Trace persistence
        is unconditional — every turn lands a trace blob — so this is available once the turn is terminal.
      operationId: get_query_trace
      responses:
        '200':
          description: The trace document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trace'
        '404':
          description: Query or trace not found
  /queries/{id}/events:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
      description: Resume from this event seq; delivery is inclusive of the given id (re-sending the last
        event is harmless — clients merge steps idempotently by step_id).
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Query
      summary: Stream a query turn's events (SSE)
      description: 'Server-sent event stream of the turn''s events as they land — the same `type`-named
        events POST /query emits with `stream: true`, but as a standalone, resumable subscription. Reconnect
        with `Last-Event-ID` to replay from where the stream dropped.'
      operationId: stream_query_events
      responses:
        '200':
          description: SSE event stream; each `event:` name is the event `type` and `data:` is its JSON
            payload.
          content:
            text/event-stream:
              schema:
                description: 'Server-sent event stream. While the turn runs, each progress frame has an
                  `id:` (the event''s sequence number — send it back as the `Last-Event-ID` header to
                  resume), an `event:` name equal to the QueryEvent `type` (e.g. `response.step`), and
                  that QueryEvent as its JSON `data:`. When the turn finishes, a final frame named `event:
                  query` is sent — no `id:`, with the full Query document as `data:`.

                  '
                oneOf:
                - $ref: '#/components/schemas/QueryEvent'
                - $ref: '#/components/schemas/Query'
        '404':
          description: Query not found
  /queries/{id}/feedback:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
