  parameters:
    ApiVersionHeader:
      in: header
      name: X-Pinecone-Api-Version
      description: Date-based contract version. Omit to resolve to the Nexus default version (`2026-07`, the
        oldest served version); send `unstable` for the in-development surface. The resolved version is
        echoed back on the same header. A present-but-unrecognized value is rejected with `400
        unsupported_api_version`.
      required: false
      style: simple
      schema:
        type: string
        default: 2026-07
        x-enum:
        - 2026-07
        - unstable
    ContextSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Context slug or UUID.
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Task id.
    FilePath:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: Relative path within the tree. Matches greedily, so it may contain `/`.
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int64
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int64
    ContextKindFilter:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ContextKind'
      description: Filter to providers valid for this context kind.
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Not permitted. Coded cases: `preview_not_enabled` (project not enabled for the Nexus
        preview), `workspace_host_required` (reached over the account host on a workspace-enabled cluster).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Session token from POST /auth/login. Pass as `Authorization: Bearer <token>`. The
        alternative `X-Pinecone-Api-Key` header is also accepted for direct-key auth (used by the Nexus
        CLI on first contact).'
    apiKey:
      type: apiKey
      in: header
      name: X-Pinecone-Api-Key
      description: Pinecone API key, accepted as an alternative to the bearer JWT.
