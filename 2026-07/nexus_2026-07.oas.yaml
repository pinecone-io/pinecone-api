openapi: 3.0.3
info:
  title: Nexus API
  contact:
    name: Pinecone Support
    url: https://support.pinecone.io
    email: support@pinecone.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 2026-07
  description: >
    Nexus turns a set of sources into a queryable, self-improving knowledge
    base. A context is **sources + a manifest**: upload sources, **curate**
    them into a searchable index (curate is explicit — there is no
    auto-curate), and then query the context. The manifest (a single validated
    JSON document) defines how the context indexes, retrieves, and answers.


    Conventions:


      * The `{slug}` path parameter accepts the URL-safe context slug **or**
        its UUID.

      * Contexts return a `ContextResponse` (derived flags), not the raw
        persisted model. Tasks return a `TaskResponse`.

      * Querying is the unified KnowQL Query API: `POST /api/query` runs one
        turn (`ask` in, answer out); multi-turn conversations are **sessions**
        (`GET/DELETE /api/sessions`, `GET /api/queries/{id}`). Read the
        answer from `output[].content[].text`.

      * Tasks are a top-level, project-owned resource at `/api/tasks` —
        they are no longer nested under contexts. Active workflow types are
        `optimize`, `curate`, `search`, `search_cc`, `search_rag`, `explore`,
        `profile`, `import`, `pack`, `restore`.
servers:
- url: https://{host}/api
  description: Your Nexus deployment host
  variables:
    host:
      default: api.example.com
security:
- bearerAuth: []
- apiKey: []
tags:
- name: Auth
  description: Login and identity.
- name: Project
  description: The active Pinecone project and its disclosure state.
- name: Contexts
  description: A context is sources + a manifest. Curate it explicitly before querying.
- name: Manifest
  description: Manifest templates and the per-context manifest.
- name: Source Files
  description: Per-context source imports (upload, connector, public repo) and the source file tree.
- name: Knowledge
  description: Read-only browse of curated knowledge (chunks + artifacts).
- name: Curation
  description: Curate workflow trigger, curation ledger, and version-pin primitives.
- name: Connectors
  description: Project-level links to external source providers (Box, ...). Linked via OAuth or an API
    key, then used to import source documents into a context.
- name: Query
  description: 'The unified KnowQL Query API: run a query turn (`/query`), fetch a turn (`/queries/{id}`),
    inspect its trace, manage feedback, comparison flags, and multi-turn sessions (`/sessions`).'
- name: Tasks
  description: Top-level, project-owned task records for every workflow (optimize, curate, search, work,
    explore, profile, import, pack, restore, groom).
- name: Task Files
  description: Read, list, and delete files from live or archived task containers.
paths:
  /auth/login:
    parameters:
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Auth
      summary: Exchange a Pinecone API key for a session token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                  description: Pinecone API key. Optional — when absent, the server falls back to its
                    configured key (managed) or validates the seeded credential (BYOC).
      responses:
        '200':
          description: Session token + identity
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - principal
                - project_id
                - project_name
                properties:
                  token:
                    type: string
                  principal:
                    type: string
                  project_id:
                    type: string
                  project_name:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No workspace exists at this host (`workspace_not_found`), on a workspace-enabled
            cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth:
    parameters:
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Auth
      summary: Current identity (whoami)
      operationId: get_identity
      responses:
        '200':
          description: The caller's identity
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - project_id
                properties:
                  user:
                    type: string
                  project_id:
                    type: string
                  project_name:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /project:
    parameters:
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Project
      summary: Get the active project
      operationId: get_project
      responses:
        '200':
          description: The project, plus whether this deployment requires a workspace host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectWithWorkspaces'
        '404':
          $ref: '#/components/responses/NotFound'
  /connectors:
    parameters:
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Connectors
      summary: List the project's linked connectors
      operationId: list_connectors
      parameters:
      - $ref: '#/components/parameters/ContextKindFilter'
      responses:
        '200':
          description: Linked connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectorView'
  /connectors/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Connectors
      summary: Get a connector
      operationId: get_connector
      responses:
        '200':
          description: The connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorView'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Connectors
      summary: Unlink a connector
      operationId: delete_connector
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - deleted
                properties:
                  deleted:
                    type: string
                    description: The deleted connector id
        '404':
          $ref: '#/components/responses/NotFound'
  /connectors/oauth/{provider}/start:
    parameters:
    - name: provider
      in: path
      required: true
      schema:
        type: string
      description: Provider id (e.g. box)
    - name: return_to
      in: query
      required: false
      schema:
        type: string
      description: Console path to bounce back to after the callback
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Connectors
      summary: Start the OAuth link flow for a provider
      description: Returns an `authorize_url` for the user to open in a browser. The connector is persisted
        by the provider's OAuth redirect callback once the user approves access.
      operationId: start_connector_oauth
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                required:
                - authorize_url
                properties:
                  authorize_url:
                    type: string
        '400':
          description: Unknown provider, or the provider is key-based
  /connectors/keys/{provider}:
    parameters:
    - name: provider
      in: path
      required: true
      schema:
        type: string
      description: A key-based provider (e.g. parallel)
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Connectors
      summary: Link a connector with an API key
      operationId: create_connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - api_key
              properties:
                api_key:
                  type: string
                account_label:
                  type: string
                  description: Optional display label
      responses:
        '200':
          description: The linked connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorView'
        '400':
          description: Unknown provider, provider uses OAuth, or empty api_key
  /connectors/{id}/items:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: folder
      in: query
      required: false
      schema:
        type: string
      description: Folder id to browse (root when absent)
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Connectors
      summary: Browse a connector's folders/files
      operationId: list_connector_items
      responses:
        '200':
          description: The folder browsed plus its children
          content:
            application/json:
              schema:
                type: object
                required:
                - folder
                - items
                properties:
                  folder:
                    type: string
                    description: The folder id that was browsed
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConnectorItem'
        '404':
          $ref: '#/components/responses/NotFound'
  /contexts/{slug}/connectors:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Connectors
      summary: List a context's connectors (with per-context enabled flag)
      operationId: list_context_connectors
      responses:
        '200':
          description: Context connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContextConnectorView'
        '404':
          description: Context not found
  /contexts/{slug}/connectors/{connector_id}:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - name: connector_id
      in: path
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ApiVersionHeader'
    put:
      tags:
      - Connectors
      summary: Enable or disable a connector for a context
      operationId: update_context_connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: The updated context connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextConnectorView'
        '400':
          description: Provider does not support this context kind
        '404':
          description: Context or connector not found
  /contexts:
    parameters:
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Contexts
      summary: List contexts (newest first, with stats)
      operationId: list_contexts
      responses:
        '200':
          description: Contexts visible to the caller in the active project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContextResponse'
    post:
      tags:
      - Contexts
      summary: Create a context
      description: 'The context is created empty and is not queryable until you import sources and curate
        them (curate is explicit — there is no auto-curate). Optionally seed a `manifest`. A `work` context
        is the exception: it is queryable from day zero and is built from traces of work rather than source
        documents.'
      operationId: create_context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContextRequest'
      responses:
        '200':
          description: The created context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Project not enabled for the Nexus preview (`preview_not_enabled`), or a per-plan
            context cap blocks creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug already exists
  /contexts/{slug}:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Contexts
      summary: Get a context
      operationId: get_context
      responses:
        '200':
          description: The context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Contexts
      summary: Update a context
      description: All fields optional; absent leaves untouched. Empty string clears description/guide;
        `{}` clears the manifest back to defaults. A supplied manifest is validated against the manifest
        schema.
      operationId: update_context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContextRequest'
      responses:
        '200':
          description: The updated context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slug conflict
    delete:
      tags:
      - Contexts
      summary: Delete a context (and its Pinecone indexes)
      operationId: delete_context
      responses:
        '200':
          description: Deleted (empty body)
        '404':
          $ref: '#/components/responses/NotFound'
        '504':
          description: Active tasks did not terminate in time
  /contexts/{slug}/fork:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Contexts
      summary: Fork a context (copy manifest into a fresh target)
      description: Copies the source context's manifest and lifecycle metadata onto an **already-created**
        target context in the same project, so the target's query and curate gates pass. It does not create
        the target — create it first with `POST /contexts`. The target's index stays empty until curated.
        The source must have been optimized (`last_optimized_at` set) and must not be optimizing.
      operationId: fork_context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - target_slug
              properties:
                target_slug:
                  type: string
                  description: Slug or UUID of an existing context in the same project
      responses:
        '200':
          description: Forked
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                properties:
                  success:
                    type: boolean
        '400':
          description: Source and target are the same context
        '404':
          description: Source or target context not found
        '409':
          description: Source is optimizing, or has never been optimized
  /contexts/{slug}/manifest:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Manifest
      summary: Get the context's manifest
      description: The context's pinned manifest document. A context with no pinned manifest returns `{}`
        — the runtime fills defaults. Writes go through the `manifest` field on `PUT /contexts/{slug}`.
      operationId: get_context_manifest
      responses:
        '200':
          description: The manifest document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '404':
          $ref: '#/components/responses/NotFound'
  /contexts/{slug}/tasks/stats:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - $ref: '#/components/parameters/ApiVersionHeader'
    get:
      tags:
      - Contexts
      summary: Per-context task statistics
      operationId: get_context_task_stats
      responses:
        '200':
          description: Aggregate task counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextStats'
        '404':
          $ref: '#/components/responses/NotFound'
  /contexts/{slug}/curate:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Curation
      summary: (Re)build the context's index from its sources
      description: 'Curate the staged sources under the active manifest. **Required before querying**
        — there is no auto-curate. Body is optional. Set `force: true` to do a full rebuild (use after
        editing the manifest); the default is an incremental curate. Search contexts only — a work context
        builds via `work`/`groom` instead.'
      operationId: curate_context
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Full rebuild rather than incremental
                batch_size:
                  type: integer
                  description: Curation batch size
                scope:
                  type: string
                  description: Curate scope recorded on the task input
                trigger:
                  type: string
                  description: Provenance label recorded on the task input
                model:
                  type: string
                  description: Model-id override for the curate runtime
                pinecone_api_key:
                  type: string
                  description: Task-token override; normally not needed
      responses:
        '200':
          description: 'Curate enqueued (`state: importing`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerResponse'
        '400':
          description: Context is a work context
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Context has no sources, is optimizing, or hit the preview task cap
    get:
      tags:
      - Curation
      summary: Get the curation ledger
      description: 'The full ledger: per-source hashes, edges, corpus groups, chunk-id lineage, version
        pin, reclaim intents, pointers, and glossary. This pays an O(corpus) chunk-id-lineage read — use
        `GET /contexts/{slug}/curate/version/pin` on the per-turn path.'
      operationId: get_curation_ledger
      responses:
        '200':
          description: Curation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationState'
        '404':
          $ref: '#/components/responses/NotFound'
  /contexts/{slug}/curate/delete-sources:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Curation
      summary: Drop named sources from the index + ledger
      operationId: delete_curated_sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sources
              properties:
                sources:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Done (empty body)
        '404':
          $ref: '#/components/responses/NotFound'
  /contexts/{slug}/optimize:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Contexts
      summary: Trigger an on-demand self-tuning optimize
      description: Tunes the manifest from real query traffic and chains a forced re-curate. A body is
        required but every field in it is optional, so `{}` is valid — and a no-op when no `candidate_queries`
        are supplied. The context must have been curated, and only one optimize runs at a time.
      operationId: optimize_context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eval_pass_rate_threshold:
                  type: number
                  format: double
                retrieval_p90_latency_ms:
                  type: integer
                  format: int64
                optimize_timeout_seconds:
                  type: integer
                  format: int64
                  description: Default 7200
                max_iterations:
                  type: integer
                  description: Default 20
                max_tool_turns:
                  type: integer
                  description: Default 200
                models:
                  type: array
                  items:
                    type: string
                  description: Model-id overrides passed to the optimize runtime
                candidate_queries:
                  type: array
                  description: Recent query records to tune toward (absent = no-op)
                  items:
                    $ref: '#/components/schemas/CandidateQuery'
                pinecone_api_key:
                  type: string
                  description: Task-token override; normally not needed
      responses:
        '200':
          description: 'Optimize enqueued (`state: optimizing`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Context is already optimizing or was never curated
  /contexts/{slug}/explore:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Contexts
      summary: Run the Design-flow explore agent (propose a manifest)
      description: Inspects the uploaded source and proposes manifest-template matches, returned in the
        task's `output` (see `ExploreOutput`). Persists nothing on the index — review the proposal, then
        apply it via the manifest update + a forced curate. Body is optional.
      operationId: explore_context
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                guide:
                  type: string
                  description: High-level guidance to steer the proposal
                pinecone_api_key:
                  type: string
                  description: Task-token override; normally not needed
      responses:
        '200':
          description: 'Explore enqueued (`state: exploring`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: An explore is already in progress
  /contexts/{slug}/profile:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Contexts
      summary: Estimate the token + time cost of curating the in-progress manifest
      description: Spins up the `profile` runtime to estimate the token + time cost of curating the sources
        under the in-progress manifest (sent in the request body), returned as the task's `output` (see
        `ProfileEstimateOutput`). Persists nothing; the console polls it for the Design-page cost box.
        Body is optional.
      operationId: profile_context
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                manifest:
                  allOf:
                  - $ref: '#/components/schemas/Manifest'
                  description: In-progress manifest to estimate against (default {})
                pinecone_api_key:
                  type: string
                  description: Task-token override; normally not needed
      responses:
        '200':
          description: 'Profile enqueued (`state: profiling`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /contexts/{slug}/import:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Source Files
      summary: Import source documents from a project connector
      description: Pull source documents from a linked project connector (Box, ...) into the context.
        Supply either `folder` or `files`. Stages the source only — curate explicitly before querying.
      operationId: import_context_sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - connector_id
              properties:
                connector_id:
                  type: string
                folder:
                  type: string
                  description: Connector folder id to import
                files:
                  type: array
                  items:
                    type: string
                  description: Connector file ids to import
                item_type:
                  type: string
                  x-enum:
                  - folder
                  - file
                  default: folder
                path:
                  type: string
                  description: Subdirectory under the source tree (default uploads)
      responses:
        '200':
          description: 'Import accepted (`state: importing`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Context or connector not found
        '409':
          description: Context is optimizing, or an import is already in flight
  /contexts/{slug}/import/upload:
    parameters:
    - $ref: '#/components/parameters/ContextSlug'
    - name: path
      in: query
      required: false
      schema:
        type: string
        default: uploads
      description: Subdirectory under the source tree
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Source Files
      summary: Upload a source file or archive
      description: One file per request, max 2 GiB. Archives (`.zip`, `.tar`, `.tar.gz`, `.tgz`) are expanded
        by the import runtime. Stages the source only — it does not index anything. Curate explicitly
        with `POST /contexts/{slug}/curate` before querying.
      operationId: upload_context_source
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 'Upload accepted; import enqueued (`state: importing`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerResponse'
        '400':
          description: Missing/unsafe file name, or archives disallowed in preview
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
