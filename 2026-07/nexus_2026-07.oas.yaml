      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ApiVersionHeader'
    post:
      tags:
      - Query
      summary: Cancel an in-progress query turn
      description: Idempotent — an already-terminal query is returned unchanged. On success the turn's
        `status` becomes `cancelled`.
      operationId: cancel_query
      responses:
        '200':
          description: The (now cancelled) query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Query'
        '404':
          $ref: '#/components/responses/NotFound'
  /queries/{id}/trace:
    parameters:
